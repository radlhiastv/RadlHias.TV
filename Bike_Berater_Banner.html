      rgba(5,10,15,0.78) 40%,
      rgba(5,10,15,0.28) 62%,
      transparent 80%
    );
  }

  .overlay-stripes {
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(
      -52deg,
      transparent,
      transparent 28px,
      rgba(255,255,255,0.028) 28px,
      rgba(255,255,255,0.028) 32px
    );
    pointer-events: none;
  }

  .overlay-vignette {
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 120px rgba(0,0,0,0.7);
    pointer-events: none;
  }

  .keil {
    position: absolute;
    top: 0; left: 0;
    width: 0; height: 0;
    border-style: solid;
    border-width: 72px 90px 0 0;
    border-color: #c85a14 transparent transparent transparent;
    z-index: 10;
  }

  .accent-line {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, #c85a14, #e06820 40%, transparent 75%);
    opacity: 0;
    transition: opacity 0.25s ease;
    z-index: 20;
    border-radius: 16px 16px 0 0;
  }
  .banner:hover .accent-line { opacity: 1; }



  /* ===== CONTENT ===== */
  .banner-content {
    position: absolute;
    inset: 0;
    z-index: 15;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 28px 0 28px 36px;
    max-width: 58%;
  }

  /* Headline zweizeilig – groß und direkt */
  .headline {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    line-height: 0.88;
    color: #ffffff;
    text-transform: uppercase;
    margin-bottom: 6px;
    letter-spacing: -1px;
  }

  .headline .line1 {
    font-size: clamp(52px, 8.5vw, 88px);
    display: block;
    margin-left: -3px;
  }

  .headline .line2 {
    font-size: clamp(38px, 6vw, 64px);
    display: block;
    color: rgba(255,255,255,0.85);
  }

  /* »» Akzent */
  .arrow-accent {
    color: #c85a14;
    font-size: 20px;
    letter-spacing: -3px;
    margin: 10px 0 12px;
    display: block;
    font-weight: 900;
    font-family: 'Barlow Condensed', sans-serif;
  }

  /* CTA-Zeile direkt unter der Headline */
  .cta-line {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(16px, 2.5vw, 20px);
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #e06820;
    margin-bottom: 18px;
  }

  /* Features – kompakt, horizontal */
  .features {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 22px;
  }

  .feature {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: #a8c8dc;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .feature::before {
    content: '✓';
    color: #c85a14;
    font-size: 11px;
  }

  /* Separator zwischen Features */
  .feature:not(:last-child)::after {
    content: '·';
    margin-left: 8px;
    color: rgba(168,200,220,0.3);
  }

  /* Button */
  .btn-cta {
    display: inline-block;
    background: #c85a14;
    color: #ffffff;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 11px 26px;
    border-radius: 4px;
    width: fit-content;
    transition: background 0.2s, transform 0.15s;
  }
  .banner:hover .btn-cta {
    background: #e06820;
    transform: translateX(4px);
  }



  /* ===== RESPONSIVE ===== */
  @media (max-width: 600px) {
    .banner { min-height: 200px; height: auto; }
    .banner-content { max-width: 80%; padding: 0 0 0 20px; }
    .features { display: none; }
  }
  html, body { margin: 0; padding: 0; height: auto; }
</style>
</head>
