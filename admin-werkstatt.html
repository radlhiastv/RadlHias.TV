<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin – Werkstatt – RadlHias.TV</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;0,900;1,400&family=Barlow+Condensed:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1c3448;
    --navy-dark: #111e28;
    --orange: #c85a14;
    --orange-light: #e06820;
    --cream: #f5f1eb;
    --cream2: #e8e2d8;
    --cream3: #ddd6c8;
    --text: #1c3448;
    --text-dim: #5a7a8a;
    --card-bg: #ffffff;
    --card-border: #ddd6c8;
    --shadow: 0 2px 20px rgba(28,52,72,0.10);
    --ok: #2e7d4f;
    --ok-bg: #e6f3ea;
    --err: #b3261e;
    --err-bg: #fbe9e7;
    --pending-bg: #fff4e0;
    --pending-text: #8a5a00;
    --wait-bg: #e6eef6;
    --wait-text: #2f5d82;
    --progress-bg: #efe6f6;
    --progress-text: #6a3d99;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Barlow', sans-serif;
    background: var(--cream);
    color: var(--text);
    min-height: 100vh;
  }
  a { color: var(--orange); }

  .topbar {
    background: linear-gradient(155deg, var(--navy) 0%, var(--navy-dark) 100%);
    color: var(--cream);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 3px solid var(--orange);
  }
  .topbar-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-size: 20px;
  }
  .topbar-title span { color: var(--orange-light); }
  .logout-btn {
    background: transparent;
    border: 1px solid rgba(245,241,235,0.4);
    color: var(--cream2);
    padding: 7px 14px;
    border-radius: 7px;
    font-size: 13px;
    cursor: pointer;
  }
  .logout-btn:hover { border-color: var(--cream); color: var(--cream); }

  .wrap { max-width: 980px; margin: 0 auto; padding: 28px 20px 70px; }
  /* Volle Fensterbreite für die Reparaturen-Tabelle (kein max-width-Deckel wie .wrap) */
  .wrap-wide { margin: 0 auto; padding: 0 20px 70px; }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--cream2);
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
  }
  .back-link:hover { color: var(--cream); }
  .login-back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 16px;
    color: var(--text-dim);
    text-decoration: none;
    font-size: 13.5px;
    font-weight: 600;
  }
  .login-back-link:hover { color: var(--text); }

  /* ---------- Login ---------- */
  .login-wrap { max-width: 380px; margin: 80px auto; padding: 0 20px; }
  .login-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 32px 28px;
    text-align: center;
  }
  .login-card h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    text-transform: uppercase;
    font-size: 22px;
    margin: 0 0 20px;
  }
  .login-card input {
    width: 100%;
    font-size: 15px;
    padding: 11px 13px;
    border: 1.5px solid var(--card-border);
    border-radius: 8px;
    margin-bottom: 14px;
  }
  .login-card button {
    width: 100%;
    background: var(--orange);
    color: #fff;
    border: none;
    font-weight: 700;
    font-size: 15px;
    padding: 12px 20px;
    border-radius: 9px;
    cursor: pointer;
  }
  .login-card button:hover { background: var(--orange-light); }
  .login-error { color: var(--err); font-size: 13.5px; margin-bottom: 12px; min-height: 1em; }

  /* ---------- Tabs ---------- */
  .tabs { display: flex; gap: 8px; margin-bottom: 22px; }
  .tab-btn {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    color: var(--text-dim);
    padding: 9px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .tab-btn.active { background: var(--navy); color: #fff; border-color: var(--navy); }
  .badge {
    background: var(--orange);
    color: #fff;
    font-size: 11.5px;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 10px;
  }

  /* ---------- Formular "Neue Annahme" ---------- */
  .form-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 24px 26px;
  }
  .form-card h2 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    text-transform: uppercase;
    font-size: 19px;
    margin: 0 0 18px;
  }
  .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px 16px; }
  .form-grid .field.full { grid-column: 1 / -1; }
  .field label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 4px; color: var(--text-dim); }
  .field .hint { font-weight: 400; text-transform: none; letter-spacing: 0; }
  .field input, .field textarea, .field select {
    width: 100%;
    font-family: 'Barlow', sans-serif;
    font-size: 14.5px;
    padding: 9px 11px;
    border: 1.5px solid var(--card-border);
    border-radius: 7px;
    background: #fff;
  }
  .field textarea { min-height: 64px; resize: vertical; }
  .form-actions { margin-top: 18px; display: flex; align-items: center; gap: 14px; }
  .form-msg { font-size: 13.5px; min-height: 1em; }
  .form-msg.ok { color: var(--ok); }
  .form-msg.err { color: var(--err); }

  .btn {
    border: none;
    border-radius: 7px;
    padding: 9px 16px;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-primary { background: var(--orange); color: #fff; }
  .btn-primary:hover { background: var(--orange-light); }
  .btn-approve { background: var(--ok); color: #fff; }
  .btn-approve:hover { background: #26643f; }
  .btn-cancel { background: var(--cream); color: var(--text-dim); }
  .btn-ghost { background: transparent; border: 1px solid var(--card-border); color: var(--text-dim); }
  .btn-ghost:hover { border-color: var(--text-dim); color: var(--text); }
  .btn-whatsapp { background: #25D366; color: #fff; white-space: nowrap; }
  .btn-whatsapp:hover:not(:disabled) { background: #1ebe57; }
  .btn[disabled] { opacity: 0.6; cursor: default; }
  .wa-sent-at { color: var(--text-dim); font-size: 11.5px; margin-top: 5px; }
  .wa-none { color: var(--text-dim); font-size: 12px; }
  .btn-delete { background: transparent; border: 1px solid #f0c4bd; color: var(--err); }
  .btn-delete:hover { background: var(--err-bg); border-color: var(--err); }

  /* ---------- Lösch-Bestätigung (Modal) ---------- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(17,30,40,0.55);
    display: flex; align-items: center; justify-content: center;
    z-index: 10000; padding: 20px;
  }
  .modal-card {
    background: var(--card-bg); border-radius: 14px; box-shadow: var(--shadow);
    padding: 26px 26px 22px; max-width: 400px; width: 100%;
  }
  .modal-card h3 {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900; text-transform: uppercase;
    font-size: 19px; margin: 0 0 10px; color: var(--err);
  }
  .modal-card p { font-size: 14px; line-height: 1.6; margin-bottom: 16px; }
  .modal-card .field { margin-bottom: 6px; }

  .status-pill {
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 3px 10px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .status-pill.st-angenommen { background: var(--pending-bg); color: var(--pending-text); }
  .status-pill.st-bestellt { background: var(--wait-bg); color: var(--wait-text); }
  .status-pill.st-bearbeitung { background: var(--progress-bg); color: var(--progress-text); }
  .status-pill.st-fertig { background: var(--ok-bg); color: var(--ok); }

  .req-actions { display: flex; gap: 10px; flex-wrap: wrap; }

  .inline-form {
    display: none;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--card-border);
  }
  .inline-form.visible { display: block; }
  .inline-form .field-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .inline-form .field { flex: 1; min-width: 160px; }
  .inline-form label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 4px; color: var(--text-dim); }
  .inline-form input, .inline-form textarea, .inline-form select {
    width: 100%;
    font-family: 'Barlow', sans-serif;
    font-size: 14px;
    padding: 8px 10px;
    border: 1.5px solid var(--card-border);
    border-radius: 7px;
  }
  .inline-form textarea { min-height: 60px; resize: vertical; }
  .inline-error { color: var(--err); font-size: 12.5px; margin-bottom: 8px; min-height: 1em; }

  /* Edit-Felder in der Tabellenzeile (Alle Reparaturen) */
  .edit-fields .field-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .edit-fields .field { flex: 1; min-width: 160px; }
  .edit-fields textarea { min-height: 60px; resize: vertical; }

  .empty-state { text-align: center; color: var(--text-dim); padding: 40px 20px; font-size: 14.5px; }
  .loading-state { text-align: center; color: var(--text-dim); padding: 40px 20px; font-size: 14.5px; }

  .list-toolbar { display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 12px; }

  /* ---------- Tabelle "Alle Reparaturen" ---------- */
  .table-scroll {
    overflow-x: auto;
    border-radius: 12px;
    box-shadow: var(--shadow);
    background: var(--card-bg);
  }
  .repair-table { width: 100%; border-collapse: collapse; min-width: 920px; }
  .repair-table th, .repair-table td {
    padding: 10px 12px;
    text-align: left;
    font-size: 13.5px;
    border-bottom: 1px solid var(--card-border);
    vertical-align: top;
  }
  .repair-table thead tr.head-row th {
    background: var(--navy);
    color: var(--cream);
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-size: 12px;
    white-space: nowrap;
  }
  .repair-table thead tr.filter-row-table th {
    background: var(--cream2);
    padding: 7px 8px;
  }
  .repair-table thead tr.filter-row-table input,
  .repair-table thead tr.filter-row-table select {
    width: 100%;
    font-family: 'Barlow', sans-serif;
    font-size: 12.5px;
    padding: 6px 7px;
    border: 1.5px solid var(--card-border);
    border-radius: 6px;
    background: #fff;
  }
  .date-filter-pair { display: flex; gap: 4px; }
  .date-filter-pair input { min-width: 0; }
  .repair-table tbody tr:hover { background: var(--cream); }
  .repair-table td.col-fahrrad { color: var(--text-dim); }
  .repair-table td.col-auftrag { max-width: 220px; }
  .repair-table tr.edit-row td { background: var(--cream); }
  .repair-table tr.edit-row { display: none; }
  .repair-table tr.edit-row.visible { display: table-row; }
  .repair-table tfoot td {
    background: var(--navy);
    color: var(--cream);
    font-weight: 700;
    font-size: 13.5px;
    border-bottom: none;
  }
  .repair-table tfoot .summary-item { margin-right: 26px; }
  .repair-table tfoot .summary-item span { color: var(--orange-light); }

  #app { display: none; }

  @media (max-width: 620px) {
    .form-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div id="login-view" class="login-wrap">
  <a href="bikeservice.html" class="login-back-link">&larr; Zurück zu Bikeservice</a>
  <div class="login-card">
    <h1>Admin-Login</h1>
    <p class="login-error" id="login-error"></p>
    <form id="login-form">
      <input type="password" id="login-password" placeholder="Passwort" autocomplete="current-password" required>
      <button type="submit" id="login-btn">Anmelden</button>
    </form>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="topbar-title">RadlHias<span>.</span> Werkstatt</div>
    <div style="display:flex; align-items:center; gap:18px;">
      <a href="bikeservice.html" class="back-link">&larr; Zurück zu Bikeservice</a>
      <button class="logout-btn" id="logout-btn">Abmelden</button>
    </div>
  </div>

  <div class="wrap">
    <div class="tabs">
      <button class="tab-btn active" data-tab="neu">Neue Annahme</button>
      <button class="tab-btn" data-tab="liste">Alle Reparaturen <span class="badge" id="liste-badge" style="display:none;">0</span></button>
    </div>

    <!-- ===== Tab: Neue Annahme ===== -->
    <div id="neu-panel">
      <div class="form-card">
        <h2>Rad annehmen</h2>
        <p class="form-msg" id="neu-msg"></p>
        <form id="neu-form">
          <div class="form-grid">
            <div class="field">
              <label>Angenommen am</label>
              <input type="date" id="f-angenommenAm" required>
            </div>
            <div class="field">
              <label>Fahrrad Typ <span class="hint">z.B. Rennrad, MTB, Trekking, E-Bike</span></label>
              <input type="text" id="f-fahrradTyp" list="fahrradtyp-optionen" required>
              <datalist id="fahrradtyp-optionen">
                <option value="Rennrad"></option>
                <option value="Mountainbike"></option>
                <option value="Trekkingrad"></option>
                <option value="E-Bike"></option>
                <option value="Kinderrad"></option>
                <option value="Gravelbike"></option>
                <option value="Sonstiges"></option>
              </datalist>
            </div>
            <div class="field">
              <label>Hersteller</label>
              <input type="text" id="f-hersteller">
            </div>
            <div class="field">
              <label>Modell</label>
              <input type="text" id="f-modell">
            </div>
            <div class="field">
              <label>Farbe</label>
              <input type="text" id="f-farbe">
            </div>
            <div class="field">
              <label>Richtpreis</label>
              <input type="text" id="f-richtpreis" placeholder="z.B. 45 €">
            </div>
            <div class="field full">
              <label>Bemerkungen</label>
              <textarea id="f-bemerkungen" placeholder="z.B. Zustand des Rades, Besonderheiten …"></textarea>
            </div>
            <div class="field full">
              <label>Was soll gemacht werden?</label>
              <textarea id="f-auftrag" required></textarea>
            </div>
            <div class="field">
              <label>Name des Kunden</label>
              <input type="text" id="f-kundeName" required>
            </div>
            <div class="field">
              <label>Telefonnummer</label>
              <input type="tel" id="f-telefon">
            </div>
            <div class="field full">
              <label>E-Mail-Adresse</label>
              <input type="email" id="f-email">
            </div>
            <div class="field full">
              <label>Adresse <span class="hint">optional – z.B. für Rechnung oder Abholung/Zustellung</span></label>
              <input type="text" id="f-adresse" placeholder="Straße Nr., PLZ Ort">
            </div>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="neu-submit-btn">Rad annehmen</button>
            <button type="button" class="btn btn-ghost" id="neu-print-btn" style="display:none;">🖨️ Werkstattauftrag drucken</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- ===== Tab: Alle Reparaturen (eigener, breiterer Container – nutzt die volle Fensterbreite) ===== -->
  <div id="liste-panel" class="wrap-wide" style="display:none;">
    <div class="list-toolbar">
      <button type="button" class="btn btn-ghost" id="filter-reset">Filter zurücksetzen</button>
      <button type="button" class="btn btn-ghost" id="liste-refresh">Aktualisieren</button>
    </div>
    <div class="table-scroll">
      <table class="repair-table">
        <thead>
          <tr class="head-row">
            <th>Angenommen</th>
            <th>Kunde</th>
            <th>Telefon</th>
            <th>Fahrrad</th>
            <th>Auftrag / Bemerkungen</th>
            <th>Status</th>
            <th>Richtpreis</th>
            <th>Endpreis</th>
            <th>Abholung</th>
            <th></th>
          </tr>
          <tr class="filter-row-table">
            <th>
              <div class="date-filter-pair">
                <input type="date" id="filter-von" title="Angenommen von">
                <input type="date" id="filter-bis" title="Angenommen bis">
              </div>
            </th>
            <th><input type="text" id="filter-kunde" placeholder="Name …"></th>
            <th><input type="text" id="filter-telefon" placeholder="Telefon …"></th>
            <th><input type="text" id="filter-fahrrad" placeholder="Typ, Hersteller, Modell …"></th>
            <th><input type="text" id="filter-auftrag" placeholder="Auftrag, Bemerkungen …"></th>
            <th><select id="filter-status"><option value="">Alle</option></select></th>
            <th></th>
            <th></th>
            <th></th>
            <th></th>
          </tr>
        </thead>
        <tbody id="liste-results">
          <tr><td colspan="10" class="loading-state">Lade Reparaturen …</td></tr>
        </tbody>
        <tfoot>
          <tr>
            <td colspan="10" id="liste-summary"></td>
          </tr>
        </tfoot>
      </table>
    </div>
  </div>
</div>

<div id="delete-modal" class="modal-overlay" style="display:none;">
  <div class="modal-card">
    <h3>Datensatz endgültig löschen?</h3>
    <p id="delete-modal-desc"></p>
    <div class="field">
      <label>Admin-Passwort zur Bestätigung</label>
      <input type="password" id="delete-modal-password" autocomplete="current-password">
    </div>
    <p class="inline-error" id="delete-modal-error"></p>
    <div class="req-actions">
      <button type="button" class="btn btn-cancel" id="delete-modal-cancel">Abbrechen</button>
      <button type="button" class="btn btn-delete" id="delete-modal-confirm" style="background:var(--err); color:#fff; border:none;">Endgültig löschen</button>
    </div>
  </div>
</div>

<script>
// Same-Origin-Route empfohlen (siehe worker/SETUP.md). Bei separater
// Subdomain hier die volle Worker-URL eintragen, z.B. "https://api.radlhias.tv".
const API_BASE_URL = "/api";

const STATUS_VALUES = ["Angenommen", "Ware bestellt", "In Bearbeitung", "Kunde informiert/fertig"];
const STATUS_CLASS = {
  "Angenommen": "st-angenommen",
  "Ware bestellt": "st-bestellt",
  "In Bearbeitung": "st-bearbeitung",
  "Kunde informiert/fertig": "st-fertig",
};

const loginView = document.getElementById("login-view");
const app = document.getElementById("app");
const loginForm = document.getElementById("login-form");
const loginError = document.getElementById("login-error");
const loginBtn = document.getElementById("login-btn");
const logoutBtn = document.getElementById("logout-btn");
const tabBtns = document.querySelectorAll(".tab-btn");
const neuPanel = document.getElementById("neu-panel");
const listePanel = document.getElementById("liste-panel");
const listeBadge = document.getElementById("liste-badge");

function api(path, options) {
  return fetch(API_BASE_URL + path, Object.assign({ credentials: "include" }, options || {}));
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str == null ? "" : String(str);
  return div.innerHTML;
}

function todayIso() {
  return new Date().toISOString().slice(0, 10);
}

function fmtDate(iso) {
  if (!iso) return "";
  // "YYYY-MM-DD" -> "DD.MM.YYYY"; alles andere unverändert anzeigen.
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso);
  if (!m) return iso;
  return `${m[3]}.${m[2]}.${m[1]}`;
}

function fmtPreis(val) {
  if (val === undefined || val === null || val === "") return "";
  const str = String(val).trim();
  return /€/.test(str) ? str : `${str} €`;
}

// ---------------------------------------------------------------------
// Werkstattauftrag drucken / als PDF speichern
// ---------------------------------------------------------------------
function buildAuftragHtml(row) {
  const rad = [row.fahrradTyp, row.hersteller, row.modell, row.farbe].filter(Boolean).join(" · ");
  const idKurz = row.id ? String(row.id).slice(0, 8) : "";
  const zeile = function(label, value) {
    return `<tr><td class="label">${escapeHtml(label)}</td><td>${value ? escapeHtml(value) : "—"}</td></tr>`;
  };
  return `<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<title>Werkstattauftrag – ${escapeHtml(row.kundeName || "")}</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; color: #1c3448; padding: 40px; max-width: 720px; margin: 0 auto; }
  h1 { font-size: 21px; border-bottom: 3px solid #c85a14; padding-bottom: 10px; margin: 0 0 4px; }
  .sub { color: #5a7a8a; font-size: 12.5px; margin-bottom: 30px; }
  .section { margin-bottom: 22px; }
  .section h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #c85a14;
    margin: 0 0 8px; border-bottom: 1px solid #ddd6c8; padding-bottom: 4px;

function printAuftrag(row) {
  if (!row) return;
  const win = window.open("", "_blank");
  if (!win) {
    alert("Pop-up wurde blockiert. Bitte Pop-ups für diese Seite erlauben, um den Werkstattauftrag zu drucken.");
    return;
  }
  win.document.open();
  win.document.write(buildAuftragHtml(row));
  win.document.close();
  // document.write feuert onload nicht immer zuverlässig -> mit kleinem
  // Timeout zusätzlich absichern.
  win.onload = function() { win.focus(); win.print(); };
  setTimeout(function() { try { win.focus(); win.print(); } catch (err) {} }, 300);
}

let deleteTargetRow = null;
const deleteModal = document.getElementById("delete-modal");
const deleteModalDesc = document.getElementById("delete-modal-desc");
const deleteModalPassword = document.getElementById("delete-modal-password");
const deleteModalError = document.getElementById("delete-modal-error");
const deleteModalConfirm = document.getElementById("delete-modal-confirm");
const deleteModalCancel = document.getElementById("delete-modal-cancel");

function openDeleteModal(row) {
  deleteTargetRow = row;
  const rad = radBeschreibung(row);
  deleteModalDesc.textContent =
    `„${row.kundeName || "Datensatz"}"${rad ? " – " + rad : ""} wird unwiderruflich gelöscht, ` +
    `auch aus der Google-Sheets-Tabelle. Das kann nicht rückgängig gemacht werden.`;
  deleteModalPassword.value = "";
  deleteModalError.textContent = "";
  deleteModalConfirm.disabled = false;
  deleteModalConfirm.textContent = "Endgültig löschen";
  deleteModal.style.display = "flex";
  deleteModalPassword.focus();
}

function closeDeleteModal() {
  deleteModal.style.display = "none";
  deleteTargetRow = null;
}

deleteModalCancel.addEventListener("click", closeDeleteModal);
deleteModal.addEventListener("click", function(e) {
  if (e.target === deleteModal) closeDeleteModal();
});

deleteModalConfirm.addEventListener("click", async function() {
  if (!deleteTargetRow) return;
  const pwd = deleteModalPassword.value;
  if (!pwd) {
    deleteModalError.textContent = "Bitte Admin-Passwort eingeben.";
    return;
  }
  deleteModalError.textContent = "";
  deleteModalConfirm.disabled = true;
  deleteModalConfirm.textContent = "Wird gelöscht …";

  try {
    const res = await api(`/admin/reparaturen/${encodeURIComponent(deleteTargetRow.id)}`, {
      method: "DELETE",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: pwd }),
    });
    const data = await res.json().catch(function(){ return {}; });

    // 401 kann zwei Ursachen haben: Session abgelaufen (-> Login) oder
    // falsches Admin-Passwort (-> Fehlermeldung im Modal, eingeloggt bleiben).
    if (res.status === 401 && data.error !== "Falsches Passwort.") {
      closeDeleteModal();
      showLogin();
      return;
    }
    if (!res.ok) {
      deleteModalError.textContent = data.error || "Löschen fehlgeschlagen.";
      deleteModalConfirm.disabled = false;
      deleteModalConfirm.textContent = "Endgültig löschen";
      return;
    }

    closeDeleteModal();
    reparaturenCache = null;
    await loadReparaturen();
  } catch (err) {
    deleteModalError.textContent = "Löschen fehlgeschlagen. Bitte erneut versuchen.";
    deleteModalConfirm.disabled = false;
    deleteModalConfirm.textContent = "Endgültig löschen";
  }
});

// Preis-String ("45 €", "45,50", "€45") in Zahl umwandeln; nicht parsbar -> 0
function parsePreis(val) {
  if (val === undefined || val === null || val === "") return 0;
  const num = parseFloat(String(val).replace(/[^\d,.-]/g, "").replace(",", "."));
  return isNaN(num) ? 0 : num;
}

function fmtEuro(num) {
  return num.toLocaleString("de-AT", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
}

function radBeschreibung(row) {
  return [row.fahrradTyp, row.hersteller, row.modell, row.farbe].filter(Boolean).join(" · ");
}

// Telefonnummer für wa.me aufbereiten: nur Ziffern, führende 0 -> AT-Vorwahl 43.
function waPhoneDigits(phone) {
  let digits = String(phone || "").replace(/[^\d+]/g, "").replace(/^\+/, "");
  if (!digits) return "";
  if (digits.startsWith("00")) digits = digits.slice(2);
  if (digits.startsWith("0")) digits = "43" + digits.slice(1);
  return digits;
}

function waAbholLink(row) {
  const digits = waPhoneDigits(row.telefon);
  if (!digits) return null;
  const rad = radBeschreibung(row) || "dein Fahrrad";
  const text = `Hallo ${row.kundeName || ""}, dein Fahrrad (${rad}) ist fertig und kann bei RadlHias.TV abgeholt werden. Danke!`;
  return `https://wa.me/${digits}?text=${encodeURIComponent(text)}`;
}

function renderList() {
  const resultsEl = document.getElementById("liste-results");
  const summaryEl = document.getElementById("liste-summary");
  if (!reparaturenCache) return;

  const von = document.getElementById("filter-von").value;
  const bis = document.getElementById("filter-bis").value;
  const fKunde = document.getElementById("filter-kunde").value.trim().toLowerCase();
  const fTelefon = document.getElementById("filter-telefon").value.trim().toLowerCase();
  const fFahrrad = document.getElementById("filter-fahrrad").value.trim().toLowerCase();
  const fAuftrag = document.getElementById("filter-auftrag").value.trim().toLowerCase();
  const fStatus = document.getElementById("filter-status").value;

  const rows = reparaturenCache.filter(function(r) {
    if (fStatus && r.status !== fStatus) return false;
    if (von && r.angenommenAm && r.angenommenAm < von) return false;
    if (bis && r.angenommenAm && r.angenommenAm > bis) return false;
    if (fKunde && !(r.kundeName || "").toLowerCase().includes(fKunde)) return false;
    if (fTelefon && !(r.telefon || "").toLowerCase().includes(fTelefon)) return false;
    if (fFahrrad && !radBeschreibung(r).toLowerCase().includes(fFahrrad)) return false;
    if (fAuftrag) {
      const haystack = [r.auftrag, r.bemerkungen, r.erledigt].filter(Boolean).join(" ").toLowerCase();
      if (!haystack.includes(fAuftrag)) return false;
    }
    return true;
  });

  if (!rows.length) {
    resultsEl.innerHTML = '<tr><td colspan="10" class="empty-state">Keine Reparaturen für diese Filter gefunden.</td></tr>';
  } else {
    resultsEl.innerHTML = rows.map(renderRow).join("");
    rows.forEach(wireRow);
  }

  // Summenzeile: Anzahl, Summe Richtpreis (alle gefilterten), Umsatz = Summe Endpreis nur
  // abgeschlossener Aufträge ("Kunde informiert/fertig") mit erfasstem Endpreis.
  const richtpreisSumme = rows.reduce(function(sum, r) { return sum + parsePreis(r.richtpreis); }, 0);
  const umsatz = rows
    .filter(function(r) { return r.status === "Kunde informiert/fertig" && r.endpreis; })
    .reduce(function(sum, r) { return sum + parsePreis(r.endpreis); }, 0);

  summaryEl.innerHTML = `
    <span class="summary-item">${rows.length} Datensatz${rows.length === 1 ? "" : "e"}</span>
    <span class="summary-item">Summe Richtpreis: <span>${fmtEuro(richtpreisSumme)}</span></span>
    <span class="summary-item">Umsatz (abgeschlossen): <span>${fmtEuro(umsatz)}</span></span>
  `;
}

function renderRow(row) {
  const statusClass = STATUS_CLASS[row.status] || "st-angenommen";
  const statusOptions = STATUS_VALUES.map(function(s) {
    return `<option value="${escapeHtml(s)}" ${s === row.status ? "selected" : ""}>${escapeHtml(s)}</option>`;
  }).join("");

  return `
    <tr data-id="${escapeHtml(row.id)}">
      <td>${fmtDate(row.angenommenAm)}</td>
      <td>
        <b>${escapeHtml(row.kundeName)}</b>
        ${row.email ? `<div style="color:var(--text-dim); font-size:12px;">${escapeHtml(row.email)}</div>` : ""}
        ${row.adresse ? `<div style="color:var(--text-dim); font-size:12px;">${escapeHtml(row.adresse)}</div>` : ""}
      </td>
      <td>${escapeHtml(row.telefon || "—")}</td>
      <td class="col-fahrrad">${escapeHtml(radBeschreibung(row) || "—")}</td>
      <td class="col-auftrag">
        ${row.auftrag ? escapeHtml(row.auftrag) : ""}
        ${row.bemerkungen ? `<div style="color:var(--text-dim); font-size:12px; margin-top:4px;">${escapeHtml(row.bemerkungen)}</div>` : ""}
      </td>
      <td><span class="status-pill ${statusClass}">${escapeHtml(row.status)}</span></td>
      <td>${row.richtpreis ? escapeHtml(fmtPreis(row.richtpreis)) : "—"}</td>
      <td>${row.endpreis ? escapeHtml(fmtPreis(row.endpreis)) : "—"}</td>
      <td>
        ${waAbholLink(row)
          ? `<button class="btn btn-whatsapp" data-action="wa-notify">📲 ${row.kundeInformiertAm ? "Erneut senden" : "Rad fertig melden"}</button>`
          : `<span class="wa-none">kein Telefon</span>`}
        ${row.kundeInformiertAm ? `<div class="wa-sent-at">gesendet: ${fmtDate(row.kundeInformiertAm)}</div>` : ""}
      </td>
      <td>
        <button class="btn btn-ghost" data-action="toggle-edit">Bearbeiten</button>
        <button class="btn btn-ghost" data-action="print-auftrag" style="margin-top:6px;">🖨️ Auftrag</button>
        <button class="btn btn-delete" data-action="delete-row" style="margin-top:6px;">🗑️ Löschen</button>
      </td>
    </tr>
    <tr class="edit-row" data-form="edit" data-id-edit="${escapeHtml(row.id)}">
      <td colspan="10">
        <div class="edit-fields">
          <p class="inline-error"></p>
          <div class="field-row">
            <div class="field">
              <label>Status</label>
              <select data-field="status">${statusOptions}</select>
            </div>
            <div class="field">
              <label>Endpreis</label>
              <input type="text" data-field="endpreis" value="${escapeHtml(row.endpreis || "")}" placeholder="z.B. 52 €">
            </div>
          </div>
          <div class="field">
            <label>Was wurde gemacht?</label>
            <textarea data-field="erledigt">${escapeHtml(row.erledigt || "")}</textarea>
          </div>
          <div class="req-actions">
            <button class="btn btn-approve" data-action="confirm-edit">Speichern</button>
            <button class="btn btn-cancel" data-action="cancel-edit">Abbrechen</button>
          </div>
        </div>
      </td>
    </tr>
  `;
}

function wireRow(row) {
  const mainRow = document.querySelector(`#liste-results tr[data-id="${CSS.escape(row.id)}"]`);
  const editRow = document.querySelector(`#liste-results tr[data-id-edit="${CSS.escape(row.id)}"]`);
  if (!mainRow || !editRow) return;

  mainRow.querySelectorAll('[data-action="toggle-edit"]').forEach(function(b) {
    b.addEventListener("click", function() { editRow.classList.toggle("visible"); });
  });
  editRow.querySelectorAll('[data-action="cancel-edit"]').forEach(function(b) {
    b.addEventListener("click", function() { editRow.classList.remove("visible"); });
  });

  mainRow.querySelectorAll('[data-action="print-auftrag"]').forEach(function(b) {
    b.addEventListener("click", function() { printAuftrag(row); });
  });

  mainRow.querySelectorAll('[data-action="delete-row"]').forEach(function(b) {
    b.addEventListener("click", function() { openDeleteModal(row); });
  });

  const waBtn = mainRow.querySelector('[data-action="wa-notify"]');
  if (waBtn) {
    waBtn.addEventListener("click", async function() {
      const link = waAbholLink(row);
      if (!link) return;
      window.open(link, "_blank", "noopener");

      const originalText = waBtn.textContent;
      waBtn.disabled = true;
      waBtn.textContent = "Wird vermerkt …";
      try {
        const res = await api(`/admin/reparaturen/${encodeURIComponent(row.id)}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ kundeInformiertAm: todayIso() }),
        });
        if (res.status === 401) { showLogin(); return; }
        if (res.ok) {
          await loadReparaturen();
          return;
        }
      } catch (err) {
        // fällt durch zum Reset unten
      }
      waBtn.disabled = false;
      waBtn.textContent = originalText;
    });
  }

  editRow.querySelector('[data-action="confirm-edit"]').addEventListener("click", async function() {
    const errEl = editRow.querySelector(".inline-error");
    errEl.textContent = "";
    const btn = this;
    btn.disabled = true;
    btn.textContent = "Wird gespeichert …";

    const patch = {
      status: editRow.querySelector('[data-field="status"]').value,
      erledigt: editRow.querySelector('[data-field="erledigt"]').value.trim(),
      endpreis: editRow.querySelector('[data-field="endpreis"]').value.trim(),
    };

    try {
      const res = await api(`/admin/reparaturen/${encodeURIComponent(row.id)}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(patch),
      });
      if (res.status === 401) { showLogin(); return; }
      const data = await res.json().catch(function(){ return {}; });
      if (!res.ok) {
        errEl.textContent = data.error || "Speichern fehlgeschlagen.";
        btn.disabled = false;
        btn.textContent = "Speichern";
        return;
      }
      await loadReparaturen();
    } catch (err) {
      errEl.textContent = "Speichern fehlgeschlagen. Bitte erneut versuchen.";
      btn.disabled = false;
      btn.textContent = "Speichern";
    }
  });
}

  const authed = await checkAuth();
