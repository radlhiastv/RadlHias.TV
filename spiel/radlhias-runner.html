<style>
  @font-face {
    font-family: 'Abuget';
    src: url('../Abuget.ttf') format('truetype');
    font-display: swap;
  }
  :root{
    --navy-deep:#0A1219; --navy:#1C3448; --navy-panel:#254560;
    --orange:#C85A14; --orange-bright:#E06820;
    --blue:#2D6E9E; --blue-bright:#4A8AAA; --blue-lt:#A8C8DC;
    --cream:#F5F1EB; --danger:#8A2020;
    --line:rgba(255,255,255,0.09);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--navy);
    color:var(--cream); font-family:'Barlow', sans-serif;
    min-height:100vh; padding-top:88px;
  }
  .stage{
    width:calc(100% - 32px); max-width:420px; background:var(--navy); margin:0 auto 16px;
    border:1px solid var(--line); border-radius:14px; overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,0.5); position:relative;
    display:none;
  }
  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:8px 16px; border-bottom:1px solid var(--line); background:var(--navy-deep); position:relative; }
  .topbar::after{ content:''; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:linear-gradient(90deg, var(--navy-panel), var(--blue), var(--orange), var(--navy-panel)); }
  .brand{ display:flex; align-items:center; gap:8px; }
  .brand img{ height:22px; width:22px; object-fit:contain; }
  .brandtext{ font-family:'Abuget', cursive; font-weight:400; color:var(--cream); font-size:36px; line-height:1; }
  .topright{ display:flex; align-items:center; gap:10px; }
  .icon-btn{ background:transparent; border:1px solid var(--line); color:var(--blue-lt); border-radius:6px; width:28px; height:28px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:14px; line-height:1; padding:0; }
  .icon-btn:active{ background:var(--orange); color:#fff; border-color:var(--orange); }
  .scoretop{ font-family:'Barlow Condensed'; font-weight:700; font-size:18px; color:var(--orange-bright); font-variant-numeric:tabular-nums; }
  .content{ padding:18px 18px 20px; display:flex; flex-direction:column; }
  h2{ font-family:'Barlow Condensed'; font-weight:700; text-transform:uppercase; letter-spacing:1.5px; font-size:14px; color:var(--blue-lt); margin:0 0 4px; }
  .eyebrow{ font-family:'Barlow Condensed'; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--orange-bright); font-size:12px; }
  p{ line-height:1.5; color:#DBE6EE; font-size:14px; margin:0 0 14px; }

  .btn{ font-family:'Barlow Condensed'; font-weight:700; text-transform:uppercase; letter-spacing:1px; font-size:16px; background:var(--orange); color:#fff; border:none; border-radius:8px; padding:13px 18px; cursor:pointer; transition:transform .08s ease, background .15s ease; }
  .btn:active{ transform:scale(0.97); background:var(--orange-bright); }
  .btn.ghost{ background:transparent; color:var(--blue-lt); border:1px solid rgba(168,200,220,0.35); }
  .btn.ghost:active{ border-color:var(--orange); color:var(--orange-bright); background:transparent; }
  .btn:disabled{ opacity:0.6; cursor:default; }
  .banner{ background:linear-gradient(135deg, rgba(200,90,20,0.18), transparent 70%); border:1px solid rgba(200,90,20,0.35); border-radius:8px; padding:10px 12px; font-size:12.5px; color:var(--cream); margin-bottom:14px; line-height:1.4; }
  .loading{ text-align:center; color:#8393A6; font-size:13px; padding:10px 0; }
  .center{ text-align:center; }

  /* ---- Seitenfüllender Einstiegs-Screen (wie Konfigurator-Begrüßung) ---- */
  .start-wrap{
    display:none; flex-direction:column; align-items:center;
    width:100%; max-width:100%; padding:40px 16px 48px;
    background:var(--navy); min-height:calc(100vh - 84px);
  }
  .icon-collage{ position:relative; width:220px; height:150px; margin:0 auto 20px; }
  .icon-collage img, .icon-collage svg{ position:absolute; filter:drop-shadow(0 4px 10px rgba(0,0,0,0.35)); }
  .ic-kind{ width:56px; top:2px; left:6px; transform:rotate(11deg); z-index:3; }
  .ic-tannenbaum{ width:54px; top:0; left:158px; transform:rotate(-6deg); z-index:2; }
  .ic-fahrrad{ width:80px; top:66px; left:8px; transform:rotate(-9deg); z-index:4; }
  .ic-stern{ width:64px; top:14px; left:78px; transform:rotate(-8deg); z-index:5; filter:drop-shadow(0 0 14px rgba(255,212,71,0.6)); }
  .ic-auto{ width:72px; top:76px; left:132px; transform:rotate(7deg); z-index:3; }
  .ic-schlagloch{ width:48px; height:29px; top:120px; left:84px; transform:rotate(4deg); z-index:1; }
  .welcome-headline{ font-family:'Abuget', cursive; font-weight:400; font-size:52px; color:var(--cream); text-align:center; margin-bottom:6px; }
  .welcome-eyebrow{ font-family:'Barlow Condensed'; font-weight:700; letter-spacing:3px; text-transform:uppercase; color:var(--blue-lt); font-size:12px; text-align:center; margin-bottom:28px; }

  .canvaswrap{ position:relative; margin-bottom:12px; border-radius:8px; overflow:hidden; border:1px solid var(--line); }
  #gameCanvas{ display:block; width:100%; height:auto; background:#0A1219; }
  .speedreadout{
    position:absolute; top:8px; right:10px;
    font-family:'Barlow Condensed'; font-weight:700; font-size:12px; letter-spacing:0.5px;
    color:var(--orange-bright); background:rgba(13,27,42,0.6); padding:3px 8px; border-radius:5px;
  }
  .speedreadout.boost{ color:#0A1219; background:var(--orange-bright); }
  .pausebtn{
    position:absolute; top:8px; left:10px;
    font-family:'Barlow Condensed'; font-weight:700; font-size:14px;
    color:var(--blue-lt); background:rgba(13,27,42,0.6); padding:3px 9px; border-radius:5px;
    cursor:pointer;
  }
  .scenetag{
    position:absolute; bottom:8px; left:10px;

    color:var(--blue-lt); background:rgba(13,27,42,0.6); padding:3px 8px; border-radius:5px; opacity:0.9;
  }
  .flash{ position:absolute; inset:0; background:rgba(138,32,32,0.4); opacity:0; pointer-events:none; }
  .flash.show{ animation:flashout .35s ease; }
  @keyframes flashout{ 0%{opacity:1;} 100%{opacity:0;} }
  .popup{
    position:absolute; font-family:'Barlow Condensed'; font-weight:900; font-size:26px; letter-spacing:0.5px;
    white-space:nowrap; color:var(--orange-bright); pointer-events:none; opacity:0;
    background:rgba(13,27,42,0.6); padding:4px 14px; border-radius:9px;
    text-shadow:0 2px 8px rgba(0,0,0,0.6);
  }
  .popup.show{ animation:popup .9s cubic-bezier(.25,.8,.3,1.4) forwards; }
  @keyframes popup{
    0%{ opacity:0; transform:translate(-50%,-50%) scale(0.4); }
    18%{ opacity:1; transform:translate(-50%,-50%) scale(1.3); }
    34%{ opacity:1; transform:translate(-50%,-50%) scale(1); }
    72%{ opacity:1; transform:translate(-50%,-70%) scale(1); }
    100%{ opacity:0; transform:translate(-50%,-140%) scale(1); }
  }
  .scenebanner{
    position:absolute; top:40%; left:50%; transform:translate(-50%,-50%);

    color:var(--cream); text-shadow:0 2px 14px rgba(200,90,20,0.7); opacity:0; pointer-events:none;
  }
  .scenebanner.show{ animation:scenebanner 1.6s ease forwards; }
  @keyframes scenebanner{ 0%{opacity:0;} 15%{opacity:1;} 75%{opacity:1;} 100%{opacity:0;} }

  .pauseoverlay{
    position:absolute; inset:0; background:rgba(13,27,42,0.86); display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:12px;
  }
  .pauseoverlay h3{ font-family:'Barlow Condensed'; font-weight:900; text-transform:uppercase; letter-spacing:2px; font-size:22px; color:var(--cream); margin:0; }

  .controls{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .ctrlbtn{
    background:var(--navy-panel); border:1px solid var(--line); color:var(--blue-lt);
    border-radius:8px; padding:16px 0; font-family:'Barlow Condensed'; font-weight:700; letter-spacing:1px;
    text-transform:uppercase; font-size:14px; text-align:center; cursor:pointer;
  }
  .ctrlbtn:active{ background:var(--orange); color:#fff; }
  .hint{ font-size:11.5px; color:#8393A6; text-align:center; margin-top:10px; }

  .legend{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:16px; }
  .legend-col-title{ font-family:'Barlow Condensed'; font-weight:700; letter-spacing:1px; text-transform:uppercase; font-size:11.5px; margin-bottom:6px; }
  .legend-col-title.good{ color:var(--blue-lt); }
  .legend-col-title.bad{ color:var(--orange-bright); }
  .legend-item{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:#C9D2DE; margin-bottom:5px; }
  .legend-item .lem{ width:22px; height:22px; object-fit:contain; filter:invert(1); flex-shrink:0; }
  .legend-item .lem-hole{ height:13px; filter:none; }

  .tabs{ display:flex; gap:6px; margin-bottom:8px; }
  .tab{
    font-family:'Barlow Condensed'; font-weight:700; letter-spacing:1px; text-transform:uppercase; font-size:12px;
    color:var(--blue-lt); background:transparent; border:1px solid var(--line); border-radius:6px; padding:6px 10px; cursor:pointer;
  }
  .tab.active{ background:var(--orange); color:#fff; border-color:var(--orange); }

  .result-time{ font-family:'Barlow Condensed'; font-weight:900; font-size:48px; color:var(--orange-bright); text-align:center; margin:4px 0 2px; font-variant-numeric:tabular-nums; }
  .result-sub{ text-align:center; color:#9AA7B8; font-size:12.5px; margin-bottom:12px; }
  .badges{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-bottom:14px; }
  .badge{
    font-family:'Barlow Condensed'; font-weight:700; font-size:11.5px; letter-spacing:0.5px;
    background:rgba(200,90,20,0.14); border:1px solid rgba(200,90,20,0.4); color:var(--orange-bright);
    padding:5px 10px; border-radius:20px;
  }
  input[type=text]{ width:100%; padding:12px 14px; border-radius:8px; border:1px solid var(--line); background:var(--navy-panel); color:var(--cream); font-family:'Barlow'; font-size:15px; margin-bottom:12px; }
  input[type=text]:focus{ outline:2px solid var(--orange); border-color:var(--orange); }
  .board{ list-style:none; margin:0; padding:0; }
  .board li{ display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px solid var(--line); font-size:14px; }
  .board li .rank{ font-family:'Barlow Condensed'; font-weight:700; color:var(--blue-lt); width:22px; text-align:right; font-size:15px; }
  .board li .rname{ flex:1; color:var(--cream); }
  .board li .rtime{ font-variant-numeric:tabular-nums; color:var(--orange-bright); font-weight:600; }
  .signoff{ font-family:'Permanent Marker', cursive; font-weight:400; color:var(--cream); font-size:18px; text-align:center; margin-top:18px; line-height:1.4; }
  .sharerow{ display:flex; gap:10px; margin-top:14px; }
  .sharerow .btn{ flex:1; }
</style>

<script>
/* ============================================================
   KONFIG
   ============================================================ */
const CONFIG = {
  GEWINNSPIEL_AKTIV: false,
  GEWINNSPIEL_TEXT: "Gewinnspiel läuft: Höchste Distanz im Monat gewinnt ein Radl Hias Überraschungspaket. Schreib deine Meter + Screenshot per DM an @radlhias.tv, um teilzunehmen.",
  LEADERBOARD_KEY: "radlhias-runner-leaderboard",
  LEADERBOARD_MAX: 20,
  CW: 380, CH: 520,
  GROUND_Y: 416,
  BASE_SPEED: 175,
  MAX_SPEED: 300,
  GRAVITY: 900,
  JUMP_SPEED: 330,
  COLLECT_BONUS: 20,
  SCENES: [
    { at:0,    name:"Dorf",  sky:['#0A1219','#16273D'], far:'haus' },
    { at:450,  name:"Wald",  sky:['#0B1B18','#15342B'], far:'tannenbaum' },
    { at:1000, name:"Alm",   sky:['#0A1219','#1E3A56'], far:'schaf' }
  ]
};

const ICON_FILES = {
  fahrrad:'fahrrad.png', schlagloch:'schlagloch.png', kind:'kind_filled.png', auto:'auto.png', flugzeug:'flugzeug.png', stern:'stern.png',
  haus:'haus.png', blume:'blume.png', tannenbaum:'tannenbaum_filled.png', blatt:'blatt.png', baum:'baum.png', schaf:'schaf.png', regenwolke:'regenwolke.png'
};
const ICONS = {};
Object.keys(ICON_FILES).forEach(key=>{
  const img = new Image();
  img.src = 'icons/' + ICON_FILES[key];
  ICONS[key] = { img, loaded:false };
  img.onload = ()=>{ ICONS[key].loaded = true; };
});
const HEADER_BG = '#0A1219';
const ICON_COLORS = {
  fahrrad: '#C85A14',
  kind: '#E4568C',
  tannenbaum: '#3F7A52',
  baum: '#3F7A52',
  schlagloch: '#000000',
  auto: '#F5F1EB',
  flugzeug: '#F5F1EB',
  stern: '#FFD447',
  haus: '#F5F1EB',
  blume: '#F5F1EB',
  schaf: '#F5F1EB',
  regenwolke: '#F5F1EB',
  blatt: '#F5F1EB'
};
const TINTED_CACHE = {};
function getTintedIcon(key, color){
  const entry = ICONS[key];
  if(!entry || !entry.loaded) return null;
  const cacheKey = key + '|' + color;
  if(TINTED_CACHE[cacheKey]) return TINTED_CACHE[cacheKey];
  const img = entry.img;
  const w = img.naturalWidth, h = img.naturalHeight;
  if(!w || !h) return null;
  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  const octx = off.getContext('2d');
  octx.drawImage(img, 0, 0);
  octx.globalCompositeOperation = 'source-in';
  octx.fillStyle = color;
  octx.fillRect(0, 0, w, h);
  TINTED_CACHE[cacheKey] = off;
  return off;
}
function drawIcon(ctx, key, cx, cy, size){
  const tinted = getTintedIcon(key, ICON_COLORS[key] || HEADER_BG);
  if(!tinted) return;
  const ratio = tinted.width / tinted.height;
  let dw = size, dh = size / ratio;
  if(dh > size){ dh = size; dw = size * ratio; }
  ctx.drawImage(tinted, cx - dw/2, cy - dh/2, dw, dh);
}
const MILESTONE_LINES = ["Passt scho!", "Sauber unterwegs!", "Ordentlich am Rad!", "Volle Kette!", "Bergauf wie im Schlaf!"];
const GAMEOVER_LINES = {
  schlagloch: ["Das war ein Schlagloch!", "Mitten ins Schlagloch!", "Schlagloch erwischt!"],
  kind: ["Kind nicht gesehen!", "Autsch, das tut weh!", "Vorsicht auf dem Radweg!"],
  auto: ["Auto im Weg!", "Blechschaden!", "Ausgebremst!"],
  flugzeug: ["Tiefflieger erwischt!", "Kopf einziehen war zu spät!", "Von oben kam's!"],
  default: ["Ab in die Werkstatt!"]
};

const content = document.getElementById('content');
const scoreTop = document.getElementById('scoreTop');
const muteBtn = document.getElementById('muteBtn');

/* ---------- Lokale Speicherung (Bestleistung, Sound) ---------- */
function lsGet(key, fallback){
  try{ const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); }
  catch(e){ return fallback; }
}
function lsSet(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); } catch(e){}
}
function getBest(){ return lsGet('radlhias-runner-best', 0); }
function setBest(v){ lsSet('radlhias-runner-best', v); }
function getSoundOn(){ return lsGet('radlhias-runner-sound', true); }
function setSoundOn(v){ lsSet('radlhias-runner-sound', v); }

let soundOn = getSoundOn();
function refreshMuteBtn(){ muteBtn.textContent = soundOn ? '🔊' : '🔇'; }
refreshMuteBtn();
muteBtn.onclick = ()=>{ soundOn = !soundOn; setSoundOn(soundOn); refreshMuteBtn(); if(soundOn) sfxBell(); };

/* ---------- Sound (Web Audio, ohne externe Dateien) ---------- */
let audioCtx = null;
function ensureAudio(){
  if(!soundOn) return null;
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; }
  }
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function playTone(freq, duration, type, gainVal, glideTo){
  const ctx = ensureAudio();
  if(!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  gain.gain.value = gainVal || 0.15;
  osc.connect(gain); gain.connect(ctx.destination);
  const now = ctx.currentTime;
  if(glideTo) osc.frequency.exponentialRampToValueAtTime(glideTo, now + duration);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
  osc.start(now); osc.stop(now + duration);
}
function sfxBell(){ playTone(1500,0.1,'triangle',0.16); setTimeout(()=>playTone(1900,0.09,'triangle',0.12),55); }
function sfxCrash(){
  const ctx = ensureAudio();
  if(!ctx) return;
  const bufferSize = Math.floor(ctx.sampleRate * 0.3);
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++){ data[i] = (Math.random()*2-1) * (1 - i/bufferSize); }
  const noise = ctx.createBufferSource(); noise.buffer = buffer;
  const gain = ctx.createGain(); gain.gain.value = 0.3;
  const filter = ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 700;
  noise.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
  noise.start();
}

/* ---------- START ---------- */
function renderStart(){
  document.getElementById('gameStage').style.display = 'none';
  const startWrap = document.getElementById('startWrap');
  startWrap.style.display = 'flex';
  startWrap.innerHTML = `
    <div class="icon-collage">
      <img src="icons/collage_kind.png" alt="" class="ic-kind">
      <img src="icons/collage_tannenbaum.png" alt="" class="ic-tannenbaum">
      <img src="icons/collage_fahrrad.png" alt="" class="ic-fahrrad">
      <img src="icons/collage_stern.png" alt="" class="ic-stern">
      <img src="icons/collage_auto.png" alt="" class="ic-auto">
      <svg viewBox="0 0 40 24" class="ic-schlagloch"><ellipse cx="20" cy="12" rx="17" ry="9" fill="#0A1219" stroke="rgba(245,241,235,0.3)" stroke-width="1.5"/></svg>
    </div>
    <div class="welcome-headline">Tour de Hias</div>
    <div class="welcome-eyebrow">Bevor du losfährst – kurz zum Spiel</div>
    <div class="welcome-card">
      <p>Hallo... schön, dass Du da bist. Ich wollte gerade eine kleine Runde Rad fahren. Bist Du dabei? Super! Dann heiße ich Dich willkommen zur "Tour de Hias". Los geht's. Wir fahren ganz entspannt. Drücke einfach nur die Pfeile nach oben und nach unten. Der Rest spielt sich ein.</p>
      <p>Weiche den kleinen Mädchen, den Autos und Schlaglöchern aus, ducke dich unter tieffliegenden Flugzeugen weg und schnapp dir Sterne für Bonuspunkte. Ein ungewollter Zusammenstoß und die Tour ist vorbei. Steige dann aber schnell wieder auf und beginne von vorn!</p>
      ${CONFIG.GEWINNSPIEL_AKTIV ? `<div class="banner">🏆 ${CONFIG.GEWINNSPIEL_TEXT}</div>` : ''}
      <div class="legend">
        <div>
          <div class="legend-col-title good">Einsammeln</div>
          <div class="legend-item"><img class="lem" src="icons/stern.png" alt=""> Stern – Bonuspunkte</div>
        </div>
        <div>

          <div class="legend-item"><img class="lem" src="icons/kind.png" alt=""> Kind – springen</div>

function setupBoardTabs(tabsId, boardId, limit){

  loadBoardInto(boardId, limit, 'all');

/* ---------- GAME STATE ---------- */
let player, obstacles, collectibles, particles, speed, distance, running, paused, lastTs;
let spawnTimer, nextSpawnGap, keyDownHandler, keyUpHandler;
let dustTimer, currentScene, lastHitKind;

function initGame(){
  document.getElementById('startWrap').style.display = 'none';
  document.getElementById('gameStage').style.display = 'block';
  content.innerHTML = `
    <div class="canvaswrap">
      <canvas id="gameCanvas" width="${CONFIG.CW}" height="${CONFIG.CH}"></canvas>
      <div class="pausebtn" id="pauseBtn">⏸</div>
      <div class="speedreadout" id="speedReadout">30 km/h</div>
      <div class="scenetag" id="sceneTag">Dorf</div>
      <div class="scenebanner" id="sceneBanner"></div>
      <div class="flash" id="flash"></div>
    </div>
    <div class="controls">
      <div class="ctrlbtn" id="jumpBtn">Springen</div>
      <div class="ctrlbtn" id="duckBtn">Ducken</div>
    </div>
    <div class="hint">Leertaste / Pfeil hoch = springen · Pfeil runter halten = ducken · Esc = Pause</div>
  `;
  player = { jumpOffset:0, vy:0, ducking:false, prevJumpOffset:0 };
  obstacles = [];
  collectibles = [];
  particles = [];
  speed = CONFIG.BASE_SPEED;
  distance = 0;
  running = true;
  paused = false;
  spawnTimer = 0;
  nextSpawnGap = 1.1;
  dustTimer = 0;
  currentScene = CONFIG.SCENES[0];

  const jumpBtn = document.getElementById('jumpBtn');
  const duckBtn = document.getElementById('duckBtn');
  jumpBtn.addEventListener('touchstart', (e)=>{ e.preventDefault(); doJump(); }, {passive:false});
  jumpBtn.addEventListener('mousedown', doJump);
  duckBtn.addEventListener('touchstart', (e)=>{ e.preventDefault(); player.ducking = true; }, {passive:false});
  duckBtn.addEventListener('touchend', (e)=>{ e.preventDefault(); player.ducking = false; }, {passive:false});
  duckBtn.addEventListener('mousedown', ()=>{ player.ducking = true; });
  duckBtn.addEventListener('mouseup', ()=>{ player.ducking = false; });
  duckBtn.addEventListener('mouseleave', ()=>{ player.ducking = false; });
  document.getElementById('pauseBtn').addEventListener('click', togglePause);

  keyDownHandler = (e)=>{
    if(e.key === ' ' || e.key === 'ArrowUp'){ doJump(); e.preventDefault(); }
    else if(e.key === 'ArrowDown'){ player.ducking = true; }
    else if(e.key === 'Escape'){ togglePause(); }
  };
  keyUpHandler = (e)=>{
    if(e.key === 'ArrowDown'){ player.ducking = false; }
  };
  document.addEventListener('keydown', keyDownHandler);
  document.addEventListener('keyup', keyUpHandler);

  lastTs = performance.now();
  requestAnimationFrame(loop);
}

function togglePause(){
  if(!running) return;
  paused = !paused;
  const wrap = document.querySelector('.canvaswrap');
  if(!wrap) return;
  let overlay = document.getElementById('pauseOverlay');
  if(paused){
    if(!overlay){
      overlay = document.createElement('div');
      overlay.className = 'pauseoverlay';
      overlay.id = 'pauseOverlay';
      overlay.innerHTML = `<h3>Pause</h3><button class="btn" id="resumeBtn">Weiter</button><button class="btn ghost" id="quitBtn">Beenden</button>`;
      wrap.appendChild(overlay);
      document.getElementById('resumeBtn').onclick = togglePause;
      document.getElementById('quitBtn').onclick = ()=>{ running = false; overlay.remove(); renderStart(); };
    }
  } else {
    lastTs = performance.now();
    if(overlay) overlay.remove();
  }
}

function doJump(){
  if(player.jumpOffset === 0 && !player.ducking){
    player.vy = CONFIG.JUMP_SPEED;
    sfxBell();
  }
}

function getPlayerRect(){
  const h = player.ducking ? 18 : 34;
  const y = CONFIG.GROUND_Y - h - player.jumpOffset;
  return { x:55, y, w:30, h };
}
function rectsOverlap(a,b){
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

function getScene(d){
  let scene = CONFIG.SCENES[0];
  for(const s of CONFIG.SCENES){ if(d >= s.at) scene = s; }
  return scene;
}

function spawnEntity(){
  const roll = Math.random();
  if(roll < 0.18){
    obstacles.push({ kind:'schlagloch', x: CONFIG.CW+10, w:34, h:14, y: CONFIG.GROUND_Y-14 });
  } else if(roll < 0.38){
    obstacles.push({ kind:'kind', x: CONFIG.CW+10, w:20, h:26, y: CONFIG.GROUND_Y-26 });
  } else if(roll < 0.58){
    obstacles.push({ kind:'auto', x: CONFIG.CW+10, w:40, h:22, y: CONFIG.GROUND_Y-22 });
  } else if(roll < 0.72){
    obstacles.push({ kind:'flugzeug', x: CONFIG.CW+10, w:46, h:28, y: CONFIG.GROUND_Y-52 });
  } else {
    collectibles.push({ kind:'stern', x: CONFIG.CW+10, w:20, h:20, y: CONFIG.GROUND_Y-58 });
  }
}

/* ---------- Partikel ---------- */
function spawnParticles(x, y, count, opts){
  for(let i=0;i<count;i++){
    particles.push({
      x, y,
      vx: (opts.vx0 || 0) + (Math.random()*2-1) * (opts.spreadX || 40),
      vy: (opts.vy0 || -30) - Math.random() * (opts.spreadY || 40),
      life:0, maxLife: (opts.life || 0.4) + Math.random()*0.2,
      size: (opts.size || 2) + Math.random()*2,
      color: opts.color || '154,167,184',
      gravity: opts.gravity != null ? opts.gravity : 200
    });
  }
}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.life += dt;
    p.x += p.vx*dt;
    p.y += p.vy*dt;
    p.vy += p.gravity*dt;
    if(p.life >= p.maxLife) particles.splice(i,1);
  }
}
function drawParticles(ctx){
  particles.forEach(p=>{
    const alpha = Math.max(0, 1 - p.life/p.maxLife);
    ctx.fillStyle = `rgba(${p.color},${alpha})`;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  });
}

/* ---------- Szenen-Banner ---------- */
function showSceneBanner(name){
  const el = document.getElementById('sceneBanner');
  if(!el) return;
  el.textContent = "— " + name + " —";
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
}

function loop(ts){
  if(!running) return;
  if(paused){ lastTs = ts; requestAnimationFrame(loop); return; }
  let dt = (ts - lastTs)/1000;
  dt = Math.min(dt, 0.05);
  lastTs = ts;

  // Physik
  player.prevJumpOffset = player.jumpOffset;
  if(player.jumpOffset > 0 || player.vy !== 0){
    player.jumpOffset += player.vy*dt;
    player.vy -= CONFIG.GRAVITY*dt;
    if(player.jumpOffset <= 0){ player.jumpOffset = 0; player.vy = 0; }
  }
  if(player.prevJumpOffset > 0 && player.jumpOffset === 0){
    const pr = getPlayerRect();
    spawnParticles(pr.x+pr.w/2, CONFIG.GROUND_Y, 6, { vy0:-10, spreadX:50, spreadY:20, life:0.3, color:'154,167,184', gravity:120 });
  }

  // Tempo & Distanz
  speed = Math.min(CONFIG.MAX_SPEED, CONFIG.BASE_SPEED + distance*0.06);
  distance += speed*dt*0.05;
  scoreTop.textContent = Math.floor(distance) + " m";
  const kmh = Math.round(speed*0.05*3.6);
  const sr = document.getElementById('speedReadout');
  if(sr){ sr.textContent = kmh + " km/h"; }

  // Szenenwechsel erkennen
  const scene = getScene(distance);
  if(scene !== currentScene){
    currentScene = scene;
    showSceneBanner(scene.name);
  }
  const tagEl = document.getElementById('sceneTag');
  if(tagEl) tagEl.textContent = currentScene.name;

  // Laufender Staub
  dustTimer += dt;
  if(dustTimer > 0.15 && player.jumpOffset === 0){
    dustTimer = 0;
    const pr = getPlayerRect();
    spawnParticles(pr.x+6, CONFIG.GROUND_Y-2, 1, { vy0:-4, spreadX:10, spreadY:6, life:0.25, color:'154,167,184', gravity:80 });
  }

  // Spawnen
  spawnTimer += dt;
  if(spawnTimer >= nextSpawnGap){
    spawnTimer = 0;
    nextSpawnGap = Math.max(0.7, 1.3 - distance*0.0015) + Math.random()*0.5;
    spawnEntity();
  }

  // Bewegen & Kollision
  const pRect = getPlayerRect();
  for(let i=obstacles.length-1;i>=0;i--){
    const o = obstacles[i];
    o.x -= speed*dt;
    if(o.x < -60){ obstacles.splice(i,1); continue; }
    if(rectsOverlap(pRect, o)){
      gameOver(o.kind);
      return;
    }
  }
  for(let i=collectibles.length-1;i>=0;i--){
    const c = collectibles[i];
    c.x -= speed*dt;
    if(c.x < -30){ collectibles.splice(i,1); continue; }
    if(rectsOverlap(pRect, c)){
      collectibles.splice(i,1);
      spawnParticles(c.x, c.y, 8, { vy0:-40, spreadX:60, spreadY:60, life:0.5, color:'200,90,20', gravity:150 });
      distance += CONFIG.COLLECT_BONUS;
      showPopup(c.x, c.y, "+" + CONFIG.COLLECT_BONUS + "m");
      sfxBell();
    }
  }

  updateParticles(dt);
  draw();
  requestAnimationFrame(loop);
}

function showPopup(x,y,text){
  const wrap = document.querySelector('.canvaswrap');
  if(!wrap) return;
  const scaleX = wrap.clientWidth / CONFIG.CW;
  const el = document.createElement('div');
  el.className = 'popup show';
  el.textContent = text;
  el.style.left = (x*scaleX) + 'px';
  el.style.top = (y*scaleX) + 'px';
  wrap.appendChild(el);
  setTimeout(()=> el.remove(), 900);
}

function draw(){
  const canvas = document.getElementById('gameCanvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const CW = CONFIG.CW, CH = CONFIG.CH, GY = CONFIG.GROUND_Y;
  const scene = currentScene;

  // Himmel
  const sky = ctx.createLinearGradient(0,0,0,GY);
  sky.addColorStop(0, scene.sky[0]); sky.addColorStop(1, scene.sky[1]);
  ctx.fillStyle = sky; ctx.fillRect(0,0,CW,GY);

  // Wolken (Parallax, 3 Größen für mehr Tiefe)
  const cloudLayers = [
    { size:76, alpha:0.26, y:GY*0.15, speed:0.08, spacing:230, phase:0 },
    { size:50, alpha:0.32, y:GY*0.30, speed:0.15, spacing:170, phase:70 },
    { size:30, alpha:0.40, y:GY*0.44, speed:0.24, spacing:120, phase:35 }
  ];
  cloudLayers.forEach(layer=>{
    ctx.globalAlpha = layer.alpha;
    const off = (distance*layer.speed + layer.phase) % layer.spacing;
    for(let i=-1;i<Math.ceil(CW/layer.spacing)+2;i++){
      const clx = i*layer.spacing - off + layer.spacing/2;
      drawIcon(ctx, 'regenwolke', clx, layer.y, layer.size);
    }
  });
  ctx.globalAlpha = 1;

  // Kulisse (Parallax, fern)
  ctx.globalAlpha = 0.55;
  const mSpacing = 150;
  const mOff = (distance*0.6) % mSpacing;
  for(let i=-1;i<4;i++){
    const bx = i*mSpacing - mOff + mSpacing/2;
    drawIcon(ctx, scene.far, bx, GY-42, 68);
  }

  // Straßenrand: Bäume in 3 Größen (wie bei den Wolken)
  ctx.globalAlpha = 0.85;
  const roadTreeLayers = [
    { size:60, spacing:210, speed:1.7, phase:15 },
    { size:42, spacing:145, speed:1.6, phase:60 },
    { size:28, spacing:100, speed:1.5, phase:35 }
  ];
  roadTreeLayers.forEach(layer=>{
    const off = (distance*layer.speed + layer.phase) % layer.spacing;
    for(let i=-1;i<Math.ceil(CW/layer.spacing)+2;i++){
      const tx = i*layer.spacing - off + layer.spacing/2;
      drawIcon(ctx, 'baum', tx, GY - layer.size/2 - 2, layer.size);
    }
  });

  // Straßenrand: kleine Blumen, dicht am Weg
  const nSpacing = 55;
  const nOff = (distance*1.6) % nSpacing;
  for(let i=-1;i<Math.ceil(CW/nSpacing)+2;i++){
    const nx = i*nSpacing - nOff + nSpacing/2;
    drawIcon(ctx, 'blume', nx, GY-15, 24);
  }
  ctx.globalAlpha = 1;

  // Boden
  ctx.fillStyle = '#254560';
  ctx.fillRect(0,GY,CW,CH-GY);
  ctx.strokeStyle = 'rgba(200,90,20,0.45)';
  ctx.lineWidth = 2;
  ctx.setLineDash([16,14]);
  const lOff = (distance*3) % 30;
  ctx.beginPath();
  ctx.moveTo(-lOff, GY+10);
  ctx.lineTo(CW, GY+10);
  ctx.stroke();
  ctx.setLineDash([]);

  // Schlaglöcher: echte Lücken im Straßenbelag statt Icon
  obstacles.forEach(o=>{
    if(o.kind !== 'schlagloch') return;
    const cx = o.x + o.w/2, cy = GY + 6;
    const rx = o.w/2 + 6, ry = 11;
    ctx.fillStyle = '#0A1219';
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 3;
    ctx.stroke();
  });

  // Hindernisse
  obstacles.forEach(o=>{
    if(o.kind === 'schlagloch') return;
    drawIcon(ctx, o.kind, o.x+o.w/2, o.y+o.h/2, Math.max(o.w, o.h)*1.3);
  });

  // Sammelobjekte
  const sternPulse = (Math.sin(performance.now()/180) + 1) / 2;
  collectibles.forEach(c=>{
    if(c.kind === 'stern'){
      ctx.shadowColor = 'rgba(255,212,71,' + (0.45 + sternPulse*0.45).toFixed(2) + ')';
      ctx.shadowBlur = 6 + sternPulse*14;
    }
    drawIcon(ctx, c.kind, c.x+c.w/2, c.y+c.h/2, Math.max(c.w, c.h)*1.5);
    if(c.kind === 'stern'){
      ctx.shadowBlur = 0;
    }
  });

  drawParticles(ctx);
  drawPlayer(ctx);
}

function drawPlayer(ctx){
  const pr = getPlayerRect();
  const cx = pr.x + pr.w/2;
  const cy = pr.y + pr.h/2;

  ctx.save();
  ctx.translate(cx, cy);
  if(player.ducking) ctx.scale(1, 0.62);
  drawIcon(ctx, 'fahrrad', 0, 2, 46);
  ctx.restore();
}

function gameOver(hitKind){
  lastHitKind = hitKind;
  running = false;
  document.removeEventListener('keydown', keyDownHandler);
  document.removeEventListener('keyup', keyUpHandler);
  sfxCrash();
  const flash = document.getElementById('flash');
  if(flash){ flash.classList.add('show'); }
  spawnParticles(getPlayerRect().x+15, getPlayerRect().y+15, 14, { vy0:-30, spreadX:90, spreadY:70, life:0.5, color:'138,32,32', gravity:220 });
  setTimeout(()=> renderResult(Math.floor(distance)), 350);
}

      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(()=> URL.revokeObjectURL(url), 2000);

    const logo = new Image();

      ctx.drawImage(logo, W/2-60, 150, 120, 120);
      finishDownload();
    };
    logo.onerror = finishDownload;

  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(drawLogoAndFinish).catch(drawLogoAndFinish);
  } else {
    drawLogoAndFinish();
  }
}

/* ---------- Storage / Bestenliste (geteilt, für alle Besucher sichtbar) ---------- */
function todayKey(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function storageKeyFor(mode){
  return mode === 'daily' ? (CONFIG.LEADERBOARD_KEY + '-daily-' + todayKey()) : CONFIG.LEADERBOARD_KEY;
}
async function storageGet(key){
  try{
    if(window.storage && typeof window.storage.get === 'function'){
      const res = await window.storage.get(key, true);
      return res ? JSON.parse(res.value) : [];
    }
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : [];
  } catch(e){ return []; }
}
async function storageSet(key, value){
  try{
    if(window.storage && typeof window.storage.set === 'function'){
      await window.storage.set(key, JSON.stringify(value), true);
    } else {
      localStorage.setItem(key, JSON.stringify(value));
    }
  } catch(e){ console.error("Konnte Bestenliste nicht speichern", e); }
}
async function getLeaderboard(mode){
  return await storageGet(storageKeyFor(mode));
}
async function submitScore(name, score){
  const entry = { name, score, date: new Date().toISOString() };
  for(const mode of ['all','daily']){
    const key = storageKeyFor(mode);
    let list = await storageGet(key);
    list.push(entry);
    list.sort((a,b)=> b.score - a.score);
    list = list.slice(0, CONFIG.LEADERBOARD_MAX);
    await storageSet(key, list);
  }
}
async function loadBoardInto(elementId, limit, mode){
  const el = document.getElementById(elementId);
  const list = await getLeaderboard(mode || 'all');
  if(!el) return;
  if(list.length === 0){
    el.innerHTML = '<li class="loading">Noch keine Einträge — sei der Erste.</li>';
    return;
  }
  el.innerHTML = list.slice(0, limit).map((entry, i)=>`
    <li><span class="rank">${i+1}</span><span class="rname">${escapeHtml(entry.name)}</span><span class="rtime">${entry.score} m</span></li>
  `).join('');
}
function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

renderStart();
</script>
