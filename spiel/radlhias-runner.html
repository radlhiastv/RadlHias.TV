<style>
  @font-face {
    font-family: 'Abuget';
    src: url('../Abuget.ttf') format('truetype');
    font-display: swap;
  }
  :root{
    --navy-deep:#0A1219; --navy:#1C3448; --navy-panel:#254560;
    --orange:#C85A14; --orange-bright:#E06820;
    --blue:#2D6E9E; --blue-bright:#4A8AAA; --blue-lt:#A8C8DC;
    --cream:#F5F1EB; --danger:#8A2020;

  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:
      radial-gradient(ellipse at 20% -10%, rgba(200,90,20,0.10), transparent 45%),
      radial-gradient(ellipse at 100% 110%, rgba(45,110,158,0.10), transparent 50%),

    color:var(--cream); font-family:'Barlow', sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:72px 16px 16px;
  }
  .stage{
    width:100%; max-width:420px; background:var(--navy);
    border:1px solid var(--line); border-radius:14px; overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,0.5); position:relative;
  }
  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--line); background:var(--navy-deep); position:relative; }
  .topbar::after{ content:''; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:linear-gradient(90deg, var(--navy-panel), var(--blue), var(--orange), var(--navy-panel)); }
  .brand{ display:flex; align-items:center; gap:8px; }
  .brand img{ height:22px; width:22px; object-fit:contain; }
  .brandtext{ font-family:'Abuget', cursive; font-weight:400; color:var(--cream); font-size:24px; }
  .topright{ display:flex; align-items:center; gap:10px; }
  .icon-btn{ background:transparent; border:1px solid var(--line); color:var(--blue-lt); border-radius:6px; width:28px; height:28px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:14px; line-height:1; padding:0; }
  .icon-btn:active{ background:var(--orange); color:#fff; border-color:var(--orange); }
  .scoretop{ font-family:'Barlow Condensed'; font-weight:700; font-size:18px; color:var(--orange-bright); font-variant-numeric:tabular-nums; }
  .content{ padding:18px 18px 20px; display:flex; flex-direction:column; }

  .herostrip-inner{ position:relative; z-index:1; }
  .btn{ font-family:'Barlow Condensed'; font-weight:700; text-transform:uppercase; letter-spacing:1px; font-size:16px; background:var(--orange); color:#fff; border:none; border-radius:8px; padding:13px 18px; cursor:pointer; transition:transform .08s ease, background .15s ease; }
  .btn:active{ transform:scale(0.97); background:var(--orange-bright); }
  .btn.ghost{ background:transparent; color:var(--blue-lt); border:1px solid rgba(168,200,220,0.35); }
  .btn.ghost:active{ border-color:var(--orange); color:var(--orange-bright); background:transparent; }

    18%{ opacity:1; transform:translate(-50%,-50%) scale(1.3); }
    34%{ opacity:1; transform:translate(-50%,-50%) scale(1); }
    72%{ opacity:1; transform:translate(-50%,-70%) scale(1); }

  .pauseoverlay{

  .controls{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .ctrlbtn{
    background:var(--navy-panel); border:1px solid var(--line); color:var(--blue-lt);

    text-transform:uppercase; font-size:14px; text-align:center; cursor:pointer;
  }

  .hint{ font-size:11.5px; color:#8393A6; text-align:center; margin-top:10px; }

  .legend{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:16px; }
  .legend-col-title{ font-family:'Barlow Condensed'; font-weight:700; letter-spacing:1px; text-transform:uppercase; font-size:11.5px; margin-bottom:6px; }
  .legend-col-title.good{ color:var(--blue-lt); }
  .legend-col-title.bad{ color:var(--orange-bright); }
  .legend-item{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:#C9D2DE; margin-bottom:5px; }
  .legend-item .lem{ font-size:18px; line-height:1; width:22px; text-align:center; }

  .tabs{ display:flex; gap:6px; margin-bottom:8px; }
  .tab{
    font-family:'Barlow Condensed'; font-weight:700; letter-spacing:1px; text-transform:uppercase; font-size:12px;
    color:var(--blue-lt); background:transparent; border:1px solid var(--line); border-radius:6px; padding:6px 10px; cursor:pointer;
  }
  .tab.active{ background:var(--orange); color:#fff; border-color:var(--orange); }

  .result-sub{ text-align:center; color:#9AA7B8; font-size:12.5px; margin-bottom:12px; }
  .badges{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-bottom:14px; }
  .badge{
    font-family:'Barlow Condensed'; font-weight:700; font-size:11.5px; letter-spacing:0.5px;
    background:rgba(200,90,20,0.14); border:1px solid rgba(200,90,20,0.4); color:var(--orange-bright);
    padding:5px 10px; border-radius:20px;
  }
  input[type=text]{ width:100%; padding:12px 14px; border-radius:8px; border:1px solid var(--line); background:var(--navy-panel); color:var(--cream); font-family:'Barlow'; font-size:15px; margin-bottom:12px; }
  input[type=text]:focus{ outline:2px solid var(--orange); border-color:var(--orange); }
  .board{ list-style:none; margin:0; padding:0; }
  .board li{ display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px solid var(--line); font-size:14px; }
  .board li .rank{ font-family:'Barlow Condensed'; font-weight:700; color:var(--blue-lt); width:22px; text-align:right; font-size:15px; }
  .board li .rname{ flex:1; color:var(--cream); }
  .board li .rtime{ font-variant-numeric:tabular-nums; color:var(--orange-bright); font-weight:600; }
  .signoff{ font-family:'Permanent Marker', cursive; font-weight:400; color:var(--cream); font-size:18px; text-align:center; margin-top:18px; line-height:1.4; }
  .sharerow{ display:flex; gap:10px; margin-top:14px; }
  .sharerow .btn{ flex:1; }
</style>

<script>
/* ============================================================
   KONFIG
   ============================================================ */
const CONFIG = {
  GEWINNSPIEL_AKTIV: false,
  GEWINNSPIEL_TEXT: "Gewinnspiel läuft: Höchste Distanz im Monat gewinnt ein Radl Hias Überraschungspaket. Schreib deine Meter + Screenshot per DM an @radlhias.tv, um teilzunehmen.",
  LEADERBOARD_KEY: "radlhias-runner-leaderboard",
  LEADERBOARD_MAX: 20,
  CW: 380, CH: 520,
  GROUND_Y: 416,
  BASE_SPEED: 175,
  MAX_SPEED: 300,
  GRAVITY: 900,
  JUMP_SPEED: 330,
  COLLECT_BONUS: 20,
  PUMP_BOOST_BONUS: 10,
  PUMP_BOOST_DURATION: 2.5,
  PUMP_BOOST_FACTOR: 1.35,
  WUFFI_BONUS: 60,
  SCENES: [
    { at:0,    name:"Dorf",  sky:['#0A1219','#16273D'], far:'🏠', near:'🪴' },
    { at:450,  name:"Wald",  sky:['#0B1B18','#15342B'], far:'🌲', near:'🍃' },
    { at:1000, name:"Alm",   sky:['#0A1219','#1E3A56'], far:'⛰️', near:'🌲' }
  ]
};

const EMOJI_FONT = "'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";
const MILESTONE_LINES = ["Passt scho!", "Sauber unterwegs!", "Ordentlich am Rad!", "Volle Kette!", "Bergauf wie im Schlaf!"];
const GAMEOVER_LINES = ["Platten!", "Aus die Maus!", "Nagel im Reifen…", "Ab in die Werkstatt!"];

const content = document.getElementById('content');
const scoreTop = document.getElementById('scoreTop');
const muteBtn = document.getElementById('muteBtn');

/* ---------- Lokale Speicherung (Bestleistung, Sound) ---------- */
function lsGet(key, fallback){
  try{ const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); }
  catch(e){ return fallback; }
}
function lsSet(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); } catch(e){}
}
function getBest(){ return lsGet('radlhias-runner-best', 0); }
function setBest(v){ lsSet('radlhias-runner-best', v); }
function getSoundOn(){ return lsGet('radlhias-runner-sound', true); }
function setSoundOn(v){ lsSet('radlhias-runner-sound', v); }

let soundOn = getSoundOn();
function refreshMuteBtn(){ muteBtn.textContent = soundOn ? '🔊' : '🔇'; }
refreshMuteBtn();
muteBtn.onclick = ()=>{ soundOn = !soundOn; setSoundOn(soundOn); refreshMuteBtn(); if(soundOn) sfxBell(); };

/* ---------- Sound (Web Audio, ohne externe Dateien) ---------- */
let audioCtx = null;
function ensureAudio(){
  if(!soundOn) return null;
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; }
  }
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function playTone(freq, duration, type, gainVal, glideTo){
  const ctx = ensureAudio();
  if(!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  gain.gain.value = gainVal || 0.15;
  osc.connect(gain); gain.connect(ctx.destination);
  const now = ctx.currentTime;
  if(glideTo) osc.frequency.exponentialRampToValueAtTime(glideTo, now + duration);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
  osc.start(now); osc.stop(now + duration);
}
function sfxBell(){ playTone(1500,0.1,'triangle',0.16); setTimeout(()=>playTone(1900,0.09,'triangle',0.12),55); }
function sfxBoost(){ playTone(260,0.3,'sawtooth',0.10,760); }
function sfxAchievement(){ playTone(880,0.12,'sine',0.14); setTimeout(()=>playTone(1320,0.2,'sine',0.14),110); }
function sfxCrash(){
  const ctx = ensureAudio();
  if(!ctx) return;
  const bufferSize = Math.floor(ctx.sampleRate * 0.3);
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++){ data[i] = (Math.random()*2-1) * (1 - i/bufferSize); }
  const noise = ctx.createBufferSource(); noise.buffer = buffer;
  const gain = ctx.createGain(); gain.gain.value = 0.3;
  const filter = ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 700;
  noise.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
  noise.start();
}

/* ---------- START ---------- */
function renderStart(){
  content.innerHTML = `
    <div class="herostrip"><div class="herostrip-inner">
      <img src="../RadlHias_Logo_freigestellt_cream.png" alt="Radl Hias" class="startlogo">
      <div class="eyebrow center">Radl Hias Runner</div>
      <h1 class="center">Rauf aufs Rad!</h1>
      <p>Weich Schlaglöchern und Nägeln aus, duck dich unter Ästen weg, schnapp dir Kettenöl und Luftpumpen für Bonusmeter. Ein Treffer und die Tour ist vorbei.</p>
    </div></div>
    ${CONFIG.GEWINNSPIEL_AKTIV ? `<div class="banner">🏆 ${CONFIG.GEWINNSPIEL_TEXT}</div>` : ''}
    <div class="legend">
      <div>
        <div class="legend-col-title good">Einsammeln</div>
        <div class="legend-item"><span class="lem">🔧</span> Kettenöl – Bonusmeter</div>
        <div class="legend-item"><span class="lem">⚡</span> Luftpumpe – Speed-Boost</div>
        <div class="legend-item"><span class="lem">🐕</span> Wuffi – großer Bonus</div>
      </div>
      <div>
        <div class="legend-col-title bad">Ausweichen</div>
        <div class="legend-item"><span class="lem">🕳️</span> Schlagloch – springen</div>
        <div class="legend-item"><span class="lem">🔩</span> Nagel – springen</div>
        <div class="legend-item"><span class="lem">🪵</span> Ast – ducken</div>
      </div>
    </div>
    <button class="btn" id="startBtn">Los geht's</button>
    <div style="margin-top:20px;">
      <h2>Bestenliste</h2>
      <div class="tabs" id="startTabs">
        <button class="tab active" data-mode="all">Gesamt</button>
        <button class="tab" data-mode="daily">Heute</button>
      </div>
      <ol class="board" id="startBoard"><li class="loading">Lade Bestenliste…</li></ol>
    </div>
  `;
  scoreTop.textContent = getBest() ? getBest() + " m Bestleistung" : "0 m";

  document.getElementById('startBtn').onclick = initGame;
  setupBoardTabs('startTabs', 'startBoard', 5);
}

function setupBoardTabs(tabsId, boardId, limit){
  const tabs = document.getElementById(tabsId);
  loadBoardInto(boardId, limit, 'all');
  tabs.querySelectorAll('.tab').forEach(tab=>{
    tab.onclick = ()=>{
      tabs.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      loadBoardInto(boardId, limit, tab.dataset.mode);
    };
  });
}

/* ---------- GAME STATE ---------- */
let player, obstacles, collectibles, particles, speed, distance, running, paused, lastTs;
let spawnTimer, nextSpawnGap, keyDownHandler, keyUpHandler;
let boostTimer, dustTimer, currentScene, wuffiFound;

function initGame(){
  content.innerHTML = `
    <div class="canvaswrap">
      <canvas id="gameCanvas" width="${CONFIG.CW}" height="${CONFIG.CH}"></canvas>
      <div class="pausebtn" id="pauseBtn">⏸</div>
      <div class="speedreadout" id="speedReadout">30 km/h</div>
      <div class="scenetag" id="sceneTag">Dorf</div>
      <div class="scenebanner" id="sceneBanner"></div>
      <div class="flash" id="flash"></div>
    </div>
    <div class="controls">
      <div class="ctrlbtn" id="jumpBtn">Springen</div>
      <div class="ctrlbtn" id="duckBtn">Ducken</div>
    </div>
    <div class="hint">Leertaste / Pfeil hoch = springen · Pfeil runter halten = ducken · Esc = Pause</div>
  `;
  player = { jumpOffset:0, vy:0, ducking:false, prevJumpOffset:0 };
  obstacles = [];
  collectibles = [];
  particles = [];
  speed = CONFIG.BASE_SPEED;
  distance = 0;
  running = true;
  paused = false;
  spawnTimer = 0;
  nextSpawnGap = 1.1;
  boostTimer = 0;
  dustTimer = 0;
  wuffiFound = false;
  currentScene = CONFIG.SCENES[0];

  const jumpBtn = document.getElementById('jumpBtn');
  const duckBtn = document.getElementById('duckBtn');
  jumpBtn.addEventListener('touchstart', (e)=>{ e.preventDefault(); doJump(); }, {passive:false});
  jumpBtn.addEventListener('mousedown', doJump);
  duckBtn.addEventListener('touchstart', (e)=>{ e.preventDefault(); player.ducking = true; }, {passive:false});
  duckBtn.addEventListener('touchend', (e)=>{ e.preventDefault(); player.ducking = false; }, {passive:false});
  duckBtn.addEventListener('mousedown', ()=>{ player.ducking = true; });
  duckBtn.addEventListener('mouseup', ()=>{ player.ducking = false; });
  duckBtn.addEventListener('mouseleave', ()=>{ player.ducking = false; });
  document.getElementById('pauseBtn').addEventListener('click', togglePause);

  keyDownHandler = (e)=>{
    if(e.key === ' ' || e.key === 'ArrowUp'){ doJump(); e.preventDefault(); }
    else if(e.key === 'ArrowDown'){ player.ducking = true; }
    else if(e.key === 'Escape'){ togglePause(); }
  };
  keyUpHandler = (e)=>{
    if(e.key === 'ArrowDown'){ player.ducking = false; }
  };
  document.addEventListener('keydown', keyDownHandler);
  document.addEventListener('keyup', keyUpHandler);

  lastTs = performance.now();
  requestAnimationFrame(loop);
}

function togglePause(){
  if(!running) return;
  paused = !paused;
  const wrap = document.querySelector('.canvaswrap');
  if(!wrap) return;
  let overlay = document.getElementById('pauseOverlay');
  if(paused){
    if(!overlay){
      overlay = document.createElement('div');
      overlay.className = 'pauseoverlay';
      overlay.id = 'pauseOverlay';
      overlay.innerHTML = `<h3>Pause</h3><button class="btn" id="resumeBtn">Weiter</button><button class="btn ghost" id="quitBtn">Beenden</button>`;
      wrap.appendChild(overlay);
      document.getElementById('resumeBtn').onclick = togglePause;
      document.getElementById('quitBtn').onclick = ()=>{ running = false; overlay.remove(); renderStart(); };
    }
  } else {
    lastTs = performance.now();
    if(overlay) overlay.remove();
  }
}

function doJump(){
  if(player.jumpOffset === 0 && !player.ducking){
    player.vy = CONFIG.JUMP_SPEED;
    sfxBell();
  }
}

function getPlayerRect(){
  const h = player.ducking ? 18 : 34;
  const y = CONFIG.GROUND_Y - h - player.jumpOffset;
  return { x:55, y, w:30, h };
}
function rectsOverlap(a,b){
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

function getScene(d){
  let scene = CONFIG.SCENES[0];
  for(const s of CONFIG.SCENES){ if(d >= s.at) scene = s; }
  return scene;
}

function spawnEntity(){
  const roll = Math.random();
  if(roll < 0.26){
    obstacles.push({ kind:'pothole', x: CONFIG.CW+10, w:34, h:14, y: CONFIG.GROUND_Y-14 });
  } else if(roll < 0.42){
    obstacles.push({ kind:'nail', x: CONFIG.CW+10, w:16, h:16, y: CONFIG.GROUND_Y-16 });
  } else if(roll < 0.68){
    obstacles.push({ kind:'branch', x: CONFIG.CW+10, w:44, h:30, y: CONFIG.GROUND_Y-50 });
  } else if(roll < 0.84){
    collectibles.push({ kind:'oil', x: CONFIG.CW+10, w:16, h:16, y: CONFIG.GROUND_Y-58 });
  } else if(roll < 0.94){
    collectibles.push({ kind:'pump', x: CONFIG.CW+10, w:14, h:24, y: CONFIG.GROUND_Y-64 });
  } else {
    collectibles.push({ kind:'wuffi', x: CONFIG.CW+10, w:20, h:16, y: CONFIG.GROUND_Y-40 });
  }
}

/* ---------- Partikel ---------- */
function spawnParticles(x, y, count, opts){
  for(let i=0;i<count;i++){
    particles.push({
      x, y,
      vx: (opts.vx0 || 0) + (Math.random()*2-1) * (opts.spreadX || 40),
      vy: (opts.vy0 || -30) - Math.random() * (opts.spreadY || 40),
      life:0, maxLife: (opts.life || 0.4) + Math.random()*0.2,
      size: (opts.size || 2) + Math.random()*2,
      color: opts.color || '154,167,184',
      gravity: opts.gravity != null ? opts.gravity : 200
    });
  }
}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.life += dt;
    p.x += p.vx*dt;
    p.y += p.vy*dt;
    p.vy += p.gravity*dt;
    if(p.life >= p.maxLife) particles.splice(i,1);
  }
}
function drawParticles(ctx){
  particles.forEach(p=>{
    const alpha = Math.max(0, 1 - p.life/p.maxLife);
    ctx.fillStyle = `rgba(${p.color},${alpha})`;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  });
}

/* ---------- Szenen-Banner ---------- */
function showSceneBanner(name){
  const el = document.getElementById('sceneBanner');
  if(!el) return;
  el.textContent = "— " + name + " —";
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
}

function loop(ts){
  if(!running) return;
  if(paused){ lastTs = ts; requestAnimationFrame(loop); return; }
  let dt = (ts - lastTs)/1000;
  dt = Math.min(dt, 0.05);
  lastTs = ts;

  // Physik
  player.prevJumpOffset = player.jumpOffset;
  if(player.jumpOffset > 0 || player.vy !== 0){
    player.jumpOffset += player.vy*dt;
    player.vy -= CONFIG.GRAVITY*dt;
    if(player.jumpOffset <= 0){ player.jumpOffset = 0; player.vy = 0; }
  }
  if(player.prevJumpOffset > 0 && player.jumpOffset === 0){
    const pr = getPlayerRect();
    spawnParticles(pr.x+pr.w/2, CONFIG.GROUND_Y, 6, { vy0:-10, spreadX:50, spreadY:20, life:0.3, color:'154,167,184', gravity:120 });
  }

  // Tempo & Distanz
  const baseSpeed = Math.min(CONFIG.MAX_SPEED, CONFIG.BASE_SPEED + distance*0.06);
  if(boostTimer > 0){
    boostTimer -= dt;
    speed = Math.min(CONFIG.MAX_SPEED * CONFIG.PUMP_BOOST_FACTOR, baseSpeed * CONFIG.PUMP_BOOST_FACTOR);
  } else {
    speed = baseSpeed;
  }
  distance += speed*dt*0.05;
  scoreTop.textContent = Math.floor(distance) + " m";
  const kmh = Math.round(speed*0.05*3.6);
  const sr = document.getElementById('speedReadout');
  if(sr){
    sr.textContent = kmh + " km/h" + (boostTimer > 0 ? " 🚀" : "");
    sr.classList.toggle('boost', boostTimer > 0);
  }

  // Szenenwechsel erkennen
  const scene = getScene(distance);
  if(scene !== currentScene){
    currentScene = scene;
    showSceneBanner(scene.name);
  }
  const tagEl = document.getElementById('sceneTag');
  if(tagEl) tagEl.textContent = currentScene.name;

  // Laufender Staub
  dustTimer += dt;
  if(dustTimer > 0.15 && player.jumpOffset === 0){
    dustTimer = 0;
    const pr = getPlayerRect();
    spawnParticles(pr.x+6, CONFIG.GROUND_Y-2, 1, { vy0:-4, spreadX:10, spreadY:6, life:0.25, color:'154,167,184', gravity:80 });
  }

  // Spawnen
  spawnTimer += dt;
  if(spawnTimer >= nextSpawnGap){
    spawnTimer = 0;
    nextSpawnGap = Math.max(0.7, 1.3 - distance*0.0015) + Math.random()*0.5;
    spawnEntity();
  }

  // Bewegen & Kollision
  const pRect = getPlayerRect();
  for(let i=obstacles.length-1;i>=0;i--){
    const o = obstacles[i];
    o.x -= speed*dt;
    if(o.x < -60){ obstacles.splice(i,1); continue; }
    if(rectsOverlap(pRect, o)){
      gameOver();
      return;
    }
  }
  for(let i=collectibles.length-1;i>=0;i--){
    const c = collectibles[i];
    c.x -= speed*dt;
    if(c.x < -30){ collectibles.splice(i,1); continue; }
    if(rectsOverlap(pRect, c)){
      collectibles.splice(i,1);
      const burstColor = c.kind === 'pump' ? '45,110,158' : '200,90,20';
      spawnParticles(c.x, c.y, 8, { vy0:-40, spreadX:60, spreadY:60, life:0.5, color:burstColor, gravity:150 });
      if(c.kind === 'oil'){
        distance += CONFIG.COLLECT_BONUS;
        showPopup(c.x, c.y, "+" + CONFIG.COLLECT_BONUS + "m");
        sfxBell();
      } else if(c.kind === 'pump'){
        distance += CONFIG.PUMP_BOOST_BONUS;
        boostTimer = CONFIG.PUMP_BOOST_DURATION;
        showPopup(c.x, c.y, "Luftdruck perfekt!");
        sfxBoost();
      } else if(c.kind === 'wuffi'){
        distance += CONFIG.WUFFI_BONUS;
        wuffiFound = true;
        showPopup(c.x, c.y, "Wuffi! +" + CONFIG.WUFFI_BONUS + "m");
        sfxAchievement();
      }
    }
  }

  updateParticles(dt);
  draw();
  requestAnimationFrame(loop);
}

function showPopup(x,y,text){
  const wrap = document.querySelector('.canvaswrap');
  if(!wrap) return;
  const scaleX = wrap.clientWidth / CONFIG.CW;
  const el = document.createElement('div');
  el.className = 'popup show';
  el.textContent = text;
  el.style.left = (x*scaleX) + 'px';
  el.style.top = (y*scaleX) + 'px';
  wrap.appendChild(el);
  setTimeout(()=> el.remove(), 900);
}

function draw(){
  const canvas = document.getElementById('gameCanvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const CW = CONFIG.CW, CH = CONFIG.CH, GY = CONFIG.GROUND_Y;
  const scene = currentScene;

  // Himmel
  const sky = ctx.createLinearGradient(0,0,0,GY);
  sky.addColorStop(0, scene.sky[0]); sky.addColorStop(1, scene.sky[1]);
  ctx.fillStyle = sky; ctx.fillRect(0,0,CW,GY);

  // Wolken (sehr langsam, oberer Himmel)
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '30px ' + EMOJI_FONT;
  ctx.globalAlpha = 0.35;
  const cOff = (distance*0.15) % 160;
  for(let i=-1;i<4;i++){
    const clx = i*160 - cOff + 80;
    ctx.fillText('☁️', clx, GY*0.28);
  }
  ctx.globalAlpha = 1;

  // Kulisse (Parallax, fern) – Emoji
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#F5F1EB';
  ctx.font = '34px ' + EMOJI_FONT;
  ctx.globalAlpha = 0.55;
  const mOff = (distance*0.6) % 120;
  for(let i=-1;i<4;i++){
    const bx = i*120 - mOff + 60;
    ctx.fillText(scene.far, bx, GY-36);
  }

  // Nahe Parallax-Reihe, schneller – Emoji
  ctx.font = '26px ' + EMOJI_FONT;
  ctx.globalAlpha = 0.85;
  const nOff = (distance*1.6) % 60;
  for(let i=-1;i<8;i++){
    const nx = i*60 - nOff + 30;
    ctx.fillText(scene.near, nx, GY-13);
  }
  ctx.globalAlpha = 1;

  // Boden
  ctx.fillStyle = '#254560';
  ctx.fillRect(0,GY,CW,CH-GY);
  ctx.strokeStyle = 'rgba(200,90,20,0.45)';
  ctx.lineWidth = 2;
  ctx.setLineDash([16,14]);
  const lOff = (distance*3) % 30;
  ctx.beginPath();
  ctx.moveTo(-lOff, GY+10);
  ctx.lineTo(CW, GY+10);
  ctx.stroke();
  ctx.setLineDash([]);

  // Hindernisse – Emoji
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#F5F1EB';
  const OBSTACLE_EMOJI = { pothole:'🕳️', nail:'🔩', branch:'🪵' };
  obstacles.forEach(o=>{
    ctx.font = Math.round(Math.max(o.w, o.h)*1.3) + 'px ' + EMOJI_FONT;
    ctx.fillText(OBSTACLE_EMOJI[o.kind], o.x+o.w/2, o.y+o.h/2);
  });

  // Sammelobjekte – Emoji
  const COLLECTIBLE_EMOJI = { oil:'🔧', pump:'⚡', wuffi:'🐕' };
  collectibles.forEach(c=>{
    ctx.font = Math.round(Math.max(c.w, c.h)*1.4) + 'px ' + EMOJI_FONT;
    ctx.fillText(COLLECTIBLE_EMOJI[c.kind], c.x+c.w/2, c.y+c.h/2);
  });

  drawParticles(ctx);
  drawPlayer(ctx);
}

function drawPlayer(ctx){
  const pr = getPlayerRect();
  const cx = pr.x + pr.w/2;
  const cy = pr.y + pr.h/2;

  ctx.save();
  ctx.translate(cx, cy);
  if(player.ducking) ctx.scale(1, 0.62);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#F5F1EB';
  ctx.font = '40px ' + EMOJI_FONT;
  ctx.shadowColor = 'rgba(245,241,235,0.9)';
  ctx.shadowBlur = 10;
  ctx.fillText('🚲', 0, 2);
  ctx.shadowBlur = 0;
  ctx.restore();
}

function gameOver(){
  running = false;
  document.removeEventListener('keydown', keyDownHandler);
  document.removeEventListener('keyup', keyUpHandler);
  sfxCrash();
  const flash = document.getElementById('flash');
  if(flash){ flash.classList.add('show'); }
  spawnParticles(getPlayerRect().x+15, getPlayerRect().y+15, 14, { vy0:-30, spreadX:90, spreadY:70, life:0.5, color:'138,32,32', gravity:220 });
  setTimeout(()=> renderResult(Math.floor(distance)), 350);
}

/* ---------- RESULT ---------- */
function renderResult(finalScore){
  const prevBest = getBest();
  const isNewBest = finalScore > prevBest;
  if(isNewBest) setBest(finalScore);

  const badges = [];
  if(isNewBest) badges.push('🏆 Neue Bestleistung!');
  if(wuffiFound) badges.push('🐕 Wuffi getroffen!');

  const gameOverLine = GAMEOVER_LINES[Math.floor(Math.random()*GAMEOVER_LINES.length)];

  content.innerHTML = `
    <div class="eyebrow center">${gameOverLine}</div>
    <div class="result-time">${finalScore} m</div>
    <div class="result-sub">Distanz zurückgelegt</div>
    ${badges.length ? `<div class="badges">${badges.map(b=>`<span class="badge">${b}</span>`).join('')}</div>` : ''}
    ${CONFIG.GEWINNSPIEL_AKTIV ? `<div class="banner">🏆 ${CONFIG.GEWINNSPIEL_TEXT}</div>` : ''}
    <input type="text" id="nameInput" placeholder="Dein Name oder Instagram-Handle" maxlength="24">
    <button class="btn" id="submitBtn">In Bestenliste eintragen</button>
    <div id="submitMsg" class="hint" style="display:none;"></div>
    <div class="sharerow">
      <button class="btn ghost" id="shareBtn">📸 Ergebnis-Bild speichern</button>
    </div>
    <div style="margin-top:18px;">
      <h2>Bestenliste</h2>
      <div class="tabs" id="resultTabs">
        <button class="tab active" data-mode="all">Gesamt</button>
        <button class="tab" data-mode="daily">Heute</button>
      </div>
      <ol class="board" id="resultBoard"><li class="loading">Lade…</li></ol>
    </div>
    <button class="btn ghost" id="againBtn" style="margin-top:14px;">Nochmal fahren</button>
    <div class="signoff">Kette rechts! Euer Radl Hias 🔧</div>
  `;
  setupBoardTabs('resultTabs', 'resultBoard', 10);

  document.getElementById('submitBtn').onclick = async ()=>{
    const nameInput = document.getElementById('nameInput');
    let name = nameInput.value.trim() || "Anonym";
    name = name.slice(0,24);
    const btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.textContent = "Speichere…";
    await submitScore(name, finalScore);
    btn.textContent = "Eingetragen ✓";
    document.getElementById('resultBoard').innerHTML = '<li class="loading">Lade…</li>';
    const activeMode = document.querySelector('#resultTabs .tab.active').dataset.mode;
    loadBoardInto('resultBoard', 10, activeMode);
    document.getElementById('submitMsg').style.display = 'block';
    document.getElementById('submitMsg').textContent = "Deine Distanz wurde in der Bestenliste gespeichert.";
  };
  document.getElementById('againBtn').onclick = renderStart;
  document.getElementById('shareBtn').onclick = ()=> saveShareImage(finalScore);
}

/* ---------- Share-Bild ---------- */
function saveShareImage(finalScore){
  const W = 600, H = 800;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  const bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0A1219'); bg.addColorStop(1,'#16273D');
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

  const borderGrad = ctx.createLinearGradient(0,0,W,0);
  borderGrad.addColorStop(0,'rgba(45,110,158,0.6)'); borderGrad.addColorStop(1,'rgba(200,90,20,0.6)');
  ctx.strokeStyle = borderGrad; ctx.lineWidth = 3;
  ctx.strokeRect(16,16,W-32,H-32);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#A8C8DC';
  ctx.font = "700 30px 'Barlow Condensed', sans-serif";
  ctx.fillText('RADL HIAS RUNNER', W/2, 130);

  ctx.fillStyle = '#E06820';
  ctx.font = "900 120px 'Barlow Condensed', sans-serif";
  ctx.fillText(finalScore + ' m', W/2, 300);

  ctx.fillStyle = '#DBE6EE';
  ctx.font = "500 22px 'Barlow', sans-serif";
  ctx.fillText('zurückgelegte Distanz', W/2, 340);

  ctx.fillStyle = '#E06820';
  ctx.font = "700 20px 'Barlow Condensed', sans-serif";
  ctx.fillText('Mitspielen & gewinnen: @radlhias.tv', W/2, H-90);

  ctx.fillStyle = '#F5F1EB';
  ctx.font = "400 40px 'Abuget', cursive";
  ctx.fillText('Radl Hias', W/2, H-38);

  function finishDownload(){
    canvas.toBlob(blob=>{
      if(!blob) return;
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `radlhias-runner-${finalScore}m.png`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(()=> URL.revokeObjectURL(url), 2000);
    }, 'image/png');
  }

  function drawLogoAndFinish(){
    const logo = new Image();
    logo.onload = ()=>{
      ctx.drawImage(logo, W/2-60, 150, 120, 120);
      finishDownload();
    };
    logo.onerror = finishDownload;
    logo.src = '../RadlHias_Logo_freigestellt_cream.png';
  }

  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(drawLogoAndFinish).catch(drawLogoAndFinish);
  } else {
    drawLogoAndFinish();
  }
}

/* ---------- Storage / Bestenliste (geteilt, für alle Besucher sichtbar) ---------- */
function todayKey(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function storageKeyFor(mode){
  return mode === 'daily' ? (CONFIG.LEADERBOARD_KEY + '-daily-' + todayKey()) : CONFIG.LEADERBOARD_KEY;
}
async function storageGet(key){
  try{
    if(window.storage && typeof window.storage.get === 'function'){
      const res = await window.storage.get(key, true);
      return res ? JSON.parse(res.value) : [];
    }
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : [];
  } catch(e){ return []; }
}
async function storageSet(key, value){
  try{
    if(window.storage && typeof window.storage.set === 'function'){
      await window.storage.set(key, JSON.stringify(value), true);
    } else {
      localStorage.setItem(key, JSON.stringify(value));
    }
  } catch(e){ console.error("Konnte Bestenliste nicht speichern", e); }
}
async function getLeaderboard(mode){
  return await storageGet(storageKeyFor(mode));
}
async function submitScore(name, score){
  const entry = { name, score, date: new Date().toISOString() };
  for(const mode of ['all','daily']){
    const key = storageKeyFor(mode);
    let list = await storageGet(key);
    list.push(entry);
    list.sort((a,b)=> b.score - a.score);
    list = list.slice(0, CONFIG.LEADERBOARD_MAX);
    await storageSet(key, list);
  }
}
async function loadBoardInto(elementId, limit, mode){
  const el = document.getElementById(elementId);
  const list = await getLeaderboard(mode || 'all');
  if(!el) return;
  if(list.length === 0){
    el.innerHTML = '<li class="loading">Noch keine Einträge — sei der Erste.</li>';
    return;
  }
  el.innerHTML = list.slice(0, limit).map((entry, i)=>`
    <li><span class="rank">${i+1}</span><span class="rname">${escapeHtml(entry.name)}</span><span class="rtime">${entry.score} m</span></li>
  `).join('');
}
function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

renderStart();
</script>
