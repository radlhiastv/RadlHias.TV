name = "radlhias-termin-api"
main = "src/index.js"
compatibility_date = "2024-11-01"

# ---------------------------------------------------------------------------
# Route (Same-Origin unter radlhias.tv/*, dann kein CORS/Cookie-SameSite-
# Sondertheater nötig, weil das Frontend auf GitHub Pages hinter demselben
# Cloudflare-Proxy läuft).
#
# WICHTIG: dieser Block muss hier oben stehen, VOR jeder [tabelle]/[[array]]-
# Kopfzeile! Nach einer TOML-Tabellen-Kopfzeile wie [[d1_databases]] oder
# [vars] gehören alle folgenden "key = value"-Zeilen zu DIESER Tabelle, bis
# die naechste Kopfzeile kommt -- ein "routes = [...]" weiter unten landet
# also als (wirkungsloses) Feld dieser Tabelle statt als echte Cloudflare-
# Route-Konfiguration. Genau das ist hier lange unbemerkt passiert; die
# tatsaechlich aktiven Routes fuer /api/*, /blog/* und /sitemap.xml wurden
# separat im Cloudflare-Dashboard gesetzt.
# ---------------------------------------------------------------------------
routes = [
  { pattern = "radlhias.tv/api/*", zone_name = "radlhias.tv" },
  # Blog: Worker rendert /blog/index.html + /blog/<slug>.html serverseitig
  # (siehe src/lib/blogTemplate.js) statt der frueheren statischen Dateien.
  { pattern = "radlhias.tv/blog/*", zone_name = "radlhias.tv" },
  # sitemap.xml wird dynamisch aus D1 generiert (siehe src/lib/sitemap.js),
  # damit neue Blogartikel automatisch auftauchen.
  { pattern = "radlhias.tv/sitemap.xml", zone_name = "radlhias.tv" },
  # Werkstatt: öffentliche Status-Seite pro Auftrag, per QR-Code auf dem
  # Werkstattauftrag erreichbar (siehe src/lib/statusTemplate.js).
  { pattern = "radlhias.tv/status/*", zone_name = "radlhias.tv" }
]

# ---------------------------------------------------------------------------
# D1-Datenbank
# ---------------------------------------------------------------------------
# Datenbank einmalig anlegen:
#   wrangler d1 create radlhias-termine
# Die Ausgabe enthält eine database_id, die hier eingetragen werden muss.
[[d1_databases]]
binding = "DB"
database_name = "radlhias-termine"
database_id = "ec574743-2b60-4318-af72-089479bb0b6a"

# ---------------------------------------------------------------------------
# KV-Namespace für Blog-Bilder (Admin-Panel-Upload, siehe src/lib/blogImages.js)
# -- KV statt R2, weil R2 eine Zahlungsmethode auf dem Cloudflare-Account
# voraussetzt (auch im Gratis-Tarif), KV nicht.
# ---------------------------------------------------------------------------
# Einmalig anlegen:
#   wrangler kv namespace create BLOG_IMAGES
# Die Ausgabe enthält eine id, die unten bei "id" eingetragen werden muss.
[[kv_namespaces]]
binding = "BLOG_IMAGES_KV"
id = "97de6b66e1464183920f8a360fc1e82d"

# ---------------------------------------------------------------------------
# Nicht-geheime Variablen (öffentlich im Bundle sichtbar, KEINE Secrets!)
# ---------------------------------------------------------------------------
[vars]
ADMIN_EMAIL = "radlhias.tv@gmail.com"
GOOGLE_CALENDAR_ID = "radlhias.tv@gmail.com"
SENDER_EMAIL = "radlhias.tv@gmail.com"
SENDER_NAME = "RadlHias.TV Werkstatt"
WORKSHOP_ADDRESS = "Wildshuter Str. 11b, 5120 St. Pantaleon"
REPLY_WINDOW_TEXT = "1-2 Werktagen"
ADMIN_PANEL_URL = "https://radlhias.tv/admin-termine.html"
# Erlaubter Frontend-Origin für CORS (bei Same-Origin-Route via radlhias.tv/api/*
# technisch nicht zwingend nötig, schadet aber nicht als Fallback / für lokale Tests)
ALLOWED_ORIGIN = "https://radlhias.tv"

# ---------------------------------------------------------------------------
# Werkstatt-Reparaturverwaltung (Google Sheets) – siehe SETUP.md Abschnitt
# "Google Sheets Anbindung". Nutzt dieselben GOOGLE_CLIENT_ID/SECRET/
# REFRESH_TOKEN-Secrets wie die Google-Calendar-Anbindung oben, der
# Refresh-Token braucht dafür zusätzlich den Scope .../auth/spreadsheets.
# ---------------------------------------------------------------------------
GOOGLE_SHEETS_SPREADSHEET_ID = "1CCHc2s0dh0f7RrjhMSC8prf0e2MD32lrFUKh477phHg"
GOOGLE_SHEETS_SHEET_NAME = "Tabellenblatt1"

# ---------------------------------------------------------------------------
# Secrets (NIEMALS hier eintragen, sondern per Wrangler CLI setzen!)
# ---------------------------------------------------------------------------
#   wrangler secret put ADMIN_PASSWORD
#   wrangler secret put SESSION_SECRET
#   wrangler secret put GOOGLE_CLIENT_ID
#   wrangler secret put GOOGLE_CLIENT_SECRET
#   wrangler secret put GOOGLE_REFRESH_TOKEN
#   wrangler secret put BREVO_API_KEY
# Details siehe SETUP.md
